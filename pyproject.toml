[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quiet-ui-skills"
version = "9.2.1"
description = "Zero-dependency 3-pillar UI architecture, deterministic metrology SVG compilers, and audience communication skills for AI coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0 AND MIT"
authors = [{ name = "FrankXLT" }]
keywords = ["design-system", "agent-skills", "svg", "metrology", "echarts", "accessibility"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = []

[project.optional-dependencies]
dev = ["selenium>=4.20", "pillow>=10.0"]

[project.urls]
Homepage = "https://FrankXLT.github.io/quiet-ui-skills/"
Repository = "https://github.com/FrankXLT/quiet-ui-skills"
Issues = "https://github.com/FrankXLT/quiet-ui-skills/issues"

[tool.setuptools]
py-modules = []
