<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motion Diagram · Quiet UI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --bg-canvas: #ffffff;
      --text-primary: #111827;
      --text-muted: #6b7280;
      --accent-primary: #bf4520;
      --border-hairline: rgba(0, 0, 0, 0.08);
      --font-sans: 'Inter', system-ui, sans-serif;
      --font-serif: 'Newsreader', 'Georgia', serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;
      --ts-xs: 11px;
    }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 48px 32px; background: var(--bg-canvas); color: var(--text-primary);
      font-family: var(--font-sans);
    }
    [data-motion-root] { width: min(100%, 1000px); }
    .eyebrow {
      margin: 0 0 8px; color: var(--text-muted); font: 500 11px/1.4 var(--font-mono);
      letter-spacing: .18em; text-transform: uppercase;
    }
    h1 { margin: 0 0 24px; font: 400 32px/1.15 var(--font-serif); }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 960px; }
    .motion-ready [data-motion-item] {
      opacity: .15; transition: opacity .4s ease, transform .4s ease;
    }
    .motion-ready [data-motion-item].is-visible { opacity: 1; transform: none; }
    [data-motion-controls] {
      display: none; align-items: center; gap: 8px; margin-top: 16px;
      font-family: var(--font-mono); font-size: var(--ts-xs, 11px);
    }
    [data-motion-controls] button {
      background: var(--bg-canvas); border: 1px solid var(--border-hairline);
      padding: 4px 10px; border-radius: 4px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div data-motion-root>
    <p class="eyebrow">Motion Sequence · Quiet UI</p>
    <h1>Event Lifecycle Pipeline</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="motion-title motion-desc">
        <title id="motion-title">Event Lifecycle Pipeline</title>
        <desc id="motion-desc">Step-by-step pipeline execution visualization</desc>
        <rect width="100%" height="100%" fill="var(--bg-canvas)"/>
        <g data-motion-item transform="translate(60, 160)">
          <rect width="160" height="70" rx="6" fill="#ffffff" stroke="var(--text-primary)"/>
          <text x="80" y="40" font-size="14" font-weight="600" text-anchor="middle">1. Ingest</text>
        </g>
        <g data-motion-item transform="translate(290, 160)">
          <rect width="160" height="70" rx="6" fill="#ffffff" stroke="var(--text-primary)"/>
          <text x="80" y="40" font-size="14" font-weight="600" text-anchor="middle">2. Validate</text>
        </g>
        <g data-motion-item transform="translate(520, 160)">
          <rect width="160" height="70" rx="6" fill="#ffffff" stroke="var(--text-primary)"/>
          <text x="80" y="40" font-size="14" font-weight="600" text-anchor="middle">3. Transform</text>
        </g>
        <g data-motion-item transform="translate(750, 160)">
          <rect width="160" height="70" rx="6" fill="#fff8f5" stroke="var(--accent-primary)"/>
          <text x="80" y="40" font-size="14" font-weight="600" fill="var(--accent-primary)" text-anchor="middle">4. Commit</text>
        </g>
      </svg>
    </div>
    <div data-motion-controls>
      <button data-motion-action="play">Play</button>
      <button data-motion-action="pause">Pause</button>
      <button data-motion-action="prev">Prev</button>
      <button data-motion-action="next">Next</button>
      <span data-motion-status>Ready</span>
    </div>
  </div>
  <script src="diagram-runtime.js" data-diagram-controls></script>
</body>
</html>
