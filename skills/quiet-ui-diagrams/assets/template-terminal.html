<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal Diagram · Quiet UI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-terminal-page: #0a0a0a;
      --bg-terminal-body: #141414;
      --bg-terminal-bar: #1b1b1b;
      --border-terminal: #2b2b2b;
      --text-terminal-ink: #f5f5f5;
      --text-terminal-muted: #9a9a9a;
      --accent-terminal: #ff5a36;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;
      --ts-xs: 11px;
    }
    body {
      font-family: var(--font-mono);
      background: var(--bg-terminal-page);
      color: var(--text-terminal-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .terminal-window {
      max-width: 1040px;
      width: 100%;
      background: var(--bg-terminal-body);
      border: 1px solid var(--border-terminal);
      border-radius: 8px;
      overflow: hidden;
    }
    .terminal-titlebar {
      background: var(--bg-terminal-bar);
      border-bottom: 1px solid var(--border-terminal);
      padding: 0.6rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .term-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .term-dot.red { background: #ff5f56; }
    .term-dot.yellow { background: #ffbd2e; }
    .term-dot.green { background: #27c93f; }
    .terminal-title {
      font-size: var(--ts-xs, 11px);
      letter-spacing: 0.08em;
      color: var(--text-terminal-muted);
      margin-left: 0.5rem;
    }
    .diagram-container { width: 100%; overflow-x: auto; padding: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="terminal-window">
    <div class="terminal-titlebar">
      <span class="term-dot red"></span>
      <span class="term-dot yellow"></span>
      <span class="term-dot green"></span>
      <span class="terminal-title">quiet-ui-diagrams --session</span>
    </div>
    <div class="diagram-container">
      <svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="term-title term-desc">
        <title id="term-title">Terminal Workflow Diagram</title>
        <desc id="term-desc">Command execution and cluster state workflow diagram</desc>
        <defs>
          <marker id="arr-term" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9a9a9a"/></marker>
          <marker id="arr-term-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ff5a36"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="var(--bg-terminal-body)"/>
        <!-- Draw connectors first, then nodes -->
      </svg>
    </div>
  </div>
</body>
</html>
