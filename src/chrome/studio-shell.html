<!DOCTYPE html>
<html lang="en" class="va-studio-root" data-medium="auto" data-studio-view="examples">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiet UI v9.1 — Interactive Studio</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3.5' fill='%230F172A'/%3E%3Cpath d='M8 2.4 13 5.2 8 8 3 5.2 8 2.4Z' fill='none' stroke='%2338BDF8' stroke-width='1.4' stroke-linejoin='round'/%3E%3Cpath d='M3 8l5 2.8L13 8M3 10.8 8 13.6l5-2.8' fill='none' stroke='%23BAE6FD' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style id="va-studio-chrome-css">
__CHROME_CSS__
  </style>
</head>
<body class="va-studio-body">
  <header id="va-studio-bar" class="va-studio-bar">
    <div class="va-bar-left">
      <div class="va-studio-brand">
        <svg class="va-brand-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.5 14 4.8 8 8 2 4.8 8 1.5Z" fill="none"/><path d="M2 8l6 3.2L14 8" fill="none"/><path d="M2 11.2 8 14.5l6-3.3" fill="none"/></svg>
        <span class="va-brand-text">Quiet UI <span class="va-studio-badge">v9.1</span></span>
      </div>
      <div id="va-studio-mode-tablist" class="va-mode-tablist" role="tablist" aria-label="Studio Mode">
        <button type="button" role="tab" id="va-tab-examples" class="va-mode-tab is-active" data-studio-tab="examples" aria-selected="true">Examples</button>
        <button type="button" role="tab" id="va-tab-components" class="va-mode-tab" data-studio-tab="components" aria-selected="false">Components</button>
      </div>
      <label class="va-inline-ctrl va-domain-ctrl va-fold-up" for="va-domain-select">
        <span class="va-ctrl-prefix">Domain:</span>
        <select id="va-domain-select" class="va-ctrl-bare-select" aria-label="Select Domain">
__WORLD_OPTIONS__
        </select>
      </label>
    </div>

    <div class="va-bar-center">
      <button type="button" id="va-step-prev" class="va-step-btn" aria-label="Previous View" title="Previous View"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3.5 5.5 8 10 12.5" fill="none"/></svg></button>
      <select id="va-view-select" class="va-studio-select va-tier-select" aria-label="Select Example View">
__VIEW_OPTIONS__
      </select>
      <button type="button" id="va-step-next" class="va-step-btn" aria-label="Next View" title="Next View"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" fill="none"/></svg></button>
    </div>

    <div class="va-bar-right">
      <button type="button" id="va-bridge-btn" class="va-studio-btn" aria-label="Design Rationale" title="Design Rationale and Quality Checks">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 7.5v4" fill="none"/><circle cx="8" cy="4.8" r="0.7" fill="currentColor"/></svg><span>Why?</span>
      </button>

      <button type="button" id="va-customize-btn" class="va-studio-btn va-gear-btn" aria-label="Settings" title="Appearance &amp; Display Settings">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="2.4"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M12.6 3.4l-1.1 1.1M4.5 11.5l-1.1 1.1" fill="none"/></svg>
        <span id="va-settings-dot" class="va-settings-dot" hidden></span>
      </button>
    </div>
  </header>

  <main id="va-portal-mat">
    <div id="va-portal-scaler">
      <div class="va-hinge-guide"></div>
      <div class="va-drag-handle va-drag-w"></div>
      <div class="va-drag-handle va-drag-e"></div>
      <div class="va-drag-handle va-drag-s"></div>
      <iframe id="va-stage-portal" name="va-stage-portal" title="Quiet UI v9.1 Preview Stage"></iframe>
    </div>
  </main>

  <dialog id="va-customize-sheet" closedby="any" aria-labelledby="va-customize-title">
    <div class="va-customize-header">
      <strong id="va-customize-title">Settings</strong>
      <button type="button" class="va-studio-btn" aria-label="Close Settings" onclick="this.closest('dialog').close()" autofocus><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none"/></svg></button>
    </div>
    <div class="va-sheet-sections">
      <div class="va-customize-field va-examples-only">
        <label class="va-customize-label" for="va-sheet-domain-select">DOMAIN</label>
        <select id="va-sheet-domain-select" class="va-studio-select">
__WORLD_OPTIONS__
        </select>
      </div>

      <div class="va-customize-field">
        <span class="va-customize-label">COLOR THEME</span>
        <div class="va-theme-cards" role="radiogroup" aria-label="Color Theme">
          <button type="button" class="va-theme-card is-active" data-sheet-theme="white" role="radio" aria-checked="true">
            <span class="va-theme-swatch" aria-hidden="true"><span class="va-swatch-bar"></span><span class="va-swatch-accent"></span></span>
            <span>White</span>
          </button>
          <button type="button" class="va-theme-card" data-sheet-theme="paper" role="radio" aria-checked="false">
            <span class="va-theme-swatch" aria-hidden="true"><span class="va-swatch-bar"></span><span class="va-swatch-accent"></span></span>
            <span>Paper</span>
          </button>
          <button type="button" class="va-theme-card" data-sheet-theme="dark-paper" role="radio" aria-checked="false">
            <span class="va-theme-swatch" aria-hidden="true"><span class="va-swatch-bar"></span><span class="va-swatch-accent"></span></span>
            <span>Slate</span>
          </button>
          <button type="button" class="va-theme-card" data-sheet-theme="dark" role="radio" aria-checked="false">
            <span class="va-theme-swatch" aria-hidden="true"><span class="va-swatch-bar"></span><span class="va-swatch-accent"></span></span>
            <span>OLED</span>
          </button>
        </div>
      </div>

      <div class="va-customize-row-2">
        <div class="va-customize-field">
          <label class="va-customize-label" for="va-sheet-medium-select">OUTPUT FORMAT</label>
          <div class="va-sheet-stage-row">
            <select id="va-sheet-medium-select" class="va-studio-select">
              <option value="auto" selected>Screen Layout</option>
              <option value="m1">Print Sheet</option>
            </select>
            <button type="button" id="va-sheet-print-btn" class="va-studio-btn va-examples-only" aria-label="Print or Export PDF" title="Print or Export PDF"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M4 6V2.5h8V6M4 11.5H2.5v-4.5h11v4.5H12" fill="none"/><rect x="4" y="9.5" width="8" height="4" fill="none"/></svg></button>
          </div>
        </div>
        <div class="va-customize-field va-examples-only">
          <label class="va-customize-label" for="va-sheet-nav-select">NAVIGATION SHELL</label>
          <select id="va-sheet-nav-select" class="va-studio-select">
            <option value="auto" selected>Auto (Recommended)</option>
            <option value="n0">None (Full Screen)</option>
            <option value="n1">Left Navigation Rail</option>
            <option value="n2">Top Bar Only</option>
            <option value="n3">Top Bar + Left Rail</option>
            <option value="n4">Bottom Mobile Bar</option>
          </select>
        </div>
      </div>

      <div class="va-customize-row-2">
        <div class="va-customize-field">
          <label class="va-customize-label" for="va-density-select">SPACING DENSITY</label>
          <select id="va-density-select" class="va-studio-select">
            <option value="d1">Spacious</option>
            <option value="d2" selected>Balanced (Default)</option>
            <option value="d3">Compact</option>
            <option value="d4">Dense Grid</option>
          </select>
        </div>
        <div class="va-customize-field">
          <label class="va-customize-label" for="va-corners-select">CORNER STYLE</label>
          <select id="va-corners-select" class="va-studio-select">
            <option value="auto" selected>Auto</option>
            <option value="sharp">Sharp</option>
            <option value="subtle">Subtle</option>
            <option value="rounded">Rounded</option>
            <option value="soft">Soft</option>
          </select>
        </div>
      </div>

      <div class="va-customize-field va-examples-only">
        <span class="va-customize-label">TEXT SCALE</span>
        <div class="va-sheet-seg" role="group" aria-label="Text Scale">
          <button type="button" class="va-sheet-seg-btn" data-sheet-scale="90">90%</button>
          <button type="button" class="va-sheet-seg-btn is-active" data-sheet-scale="100">100%</button>
          <button type="button" class="va-sheet-seg-btn" data-sheet-scale="110">110%</button>
          <button type="button" class="va-sheet-seg-btn" data-sheet-scale="125">125%</button>
        </div>
      </div>

      <div class="va-customize-field">
        <label class="va-customize-label" for="va-sheet-vp-select">DEVICE VIEWPORT</label>
        <div class="va-sheet-stage-row">
          <select id="va-sheet-vp-select" class="va-studio-select">
            <option value="fill" selected>Fill Screen</option>
            <option value="390x844">Phone (390×844)</option>
            <option value="840x1050">Foldable (840×1050)</option>
            <option value="1920x1080">Desktop (1080p)</option>
            <option value="3840x2160">4K UHD</option>
          </select>
          <button type="button" id="va-sheet-rotate-btn" class="va-studio-btn" aria-label="Rotate Device Viewport" title="Rotate Viewport"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.4-3.5" fill="none"/><path d="M13 2.5v2.8h-2.8" fill="none"/></svg></button>
          <button type="button" id="va-sheet-zoom-btn" class="va-studio-btn" title="Toggle Fit vs 1:1">FIT</button>
        </div>
      </div>

      <div class="va-customize-field va-examples-only">
        <span class="va-customize-label">SHARE PRESET</span>
        <div class="va-prompt-row">
          <code id="va-prompt-preview" class="va-prompt-preview">Domain: 01 · View: v01</code>
          <button type="button" id="va-copy-prompt-btn" class="va-studio-btn">Copy</button>
        </div>
      </div>
    </div>
  </dialog>

  <dialog id="va-bridge-dialog" closedby="any" aria-labelledby="va-bridge-title">
    <div class="va-customize-header">
      <div class="va-bridge-hdr-copy">
        <span class="va-customize-label">DESIGN RATIONALE &amp; VERIFICATION</span>
        <strong id="va-bridge-title">Why This Layout?</strong>
      </div>
      <button type="button" class="va-studio-btn" aria-label="Close Design Rationale" onclick="this.closest('dialog').close()" autofocus><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none"/></svg></button>
    </div>
    <div id="va-bridge-body" class="va-bridge-body"></div>
  </dialog>

  <script type="text/plain" id="va-bundled-portal-css">
__PORTAL_CSS__
  </script>
  <script type="text/plain" id="va-bundled-stage-js">
__STAGE_JS__
  </script>
  <script type="application/json" id="va-v9-manifest">
__V9_MANIFEST_JSON__
  </script>

__VIEW_TEMPLATES__

  <script>
__STUDIO_JS__
  </script>
</body>
</html>
