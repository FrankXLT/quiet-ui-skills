          <div class="doc4a-byline">

            <p>

        <!-- 6 Sequenced Steps with Full Operational Depth -->
        <div class="doc4a-steps-container">
          <section class="step-anchor" id="step-1">
            <h3>Step 01: Verify 1064 nm Uplink Beacon Acquisition</h3>
            <p>Ensure Table Mountain Observatory 1064 nm laser beacon transmitter is locked and centroid jitter is &le; 0.50 &mu;rad RMS across adaptive optics sensors.</p>
            <div class="step-details-grid">
              <div class="step-detail-box">
                <strong>Prerequisites:</strong> Laser clearinghouse clearance active; telescope dome open; azimuth locked at 242.4&deg;.
              </div>
              <div class="step-detail-box">
                <strong>Telemetry Gate:</strong> Centroid RMS jitter &le; 0.38 &mu;rad; detector signal-to-noise ratio &ge; 18.5 dB.
              </div>
              <div class="step-detail-box">
                <strong>Rollback / Safing:</strong> If beacon unlock persists &gt; 15s, disengage tracking and command ground mount to standby stow.
              </div>
            </div>
          </section>

          <section class="step-anchor" id="step-2">
            <h3>Step 02: Calibrate Relativistic Point-Ahead Vector</h3>
            <p>Query JPL Horizons trajectory kernel for two-way light time (2.6 AU = 21.6 minutes) and compute relativistic aberration offset.</p>
            <div class="step-details-grid">
              <div class="step-detail-box">
                <strong>Prerequisites:</strong> Ground ephemeris kernel <code>de440.bsp</code> loaded; spacecraft clock syntonized.
              </div>
              <div class="step-detail-box">
                <strong>Telemetry Gate:</strong> Calculated point-ahead offset vector within &plusmn;33.4 &mu;rad azimuth, &plusmn;7.9 &mu;rad elevation.
              </div>
              <div class="step-detail-box">
                <strong>Rollback / Safing:</strong> If ephemeris residuals exceed 1.0 &mu;rad, revert to coarse open-loop blind pointing.
              </div>
            </div>
          </section>

          <section class="step-anchor" id="step-3">
            <h3>Step 03: Enable 1550 nm Downlink Optical Transmitter</h3>
            <p>Energize flight laser diode pump modules to 1.25 kW peak power and set beam divergence to 12.5 &mu;rad.</p>
            <div class="step-details-grid">
              <div class="step-detail-box">
                <strong>Prerequisites:</strong> Laser interlock keys inserted; FAA air traffic sector surveillance radar confirmed clear.
              </div>
              <div class="step-detail-box">
                <strong>Telemetry Gate:</strong> Optical output power reaches 1250 mW nominal; chiller thermal loop steady at 21.0&deg;C.
              </div>
              <div class="step-detail-box">
                <strong>Rollback / Safing:</strong> Thermal alarm at 28.0&deg;C immediately triggers pump diode crowbar shutdown.
              </div>
            </div>
          </section>

          <section class="step-anchor" id="step-4">
            <h3>Step 04: Engage Ground SCPPM Iterative BCJR Soft Decoder</h3>
            <p>Lock the Palomar cryogenic SNSPD photon counter time-tagger and initialize the 64-ary SCPPM trellis decoder.</p>
            <div class="step-details-grid">
              <div class="step-detail-box">
                <strong>Prerequisites:</strong> Cryostat temperature &le; 0.85 K; SNSPD bias voltage locked at 1.82 V.
              </div>
              <div class="step-detail-box">
                <strong>Telemetry Gate:</strong> Trellis soft decoder locks at 10 iterations; Attached Sync Marker (ASM) correlation &gt; 99.8%.
              </div>
              <div class="step-detail-box">
                <strong>Rollback / Safing:</strong> On soft abort, step modulation down to M=128 fallback order.
              </div>
            </div>
          </section>

          <section class="step-anchor" id="step-5">
            <h3>Step 05: Ingest &amp; Validate High-Rate Science Telemetry</h3>
            <p>Monitor packet error rate (&le; 1e-6) while streaming 267.0 Mbps science data packets directly into the mission archive.</p>
            <div class="step-details-grid">
              <div class="step-detail-box">
                <strong>Prerequisites:</strong> Storage ring buffer allocated; PCIe DMA ring active with zero overrun flags.
              </div>
              <div class="step-detail-box">
                <strong>Telemetry Gate:</strong> Science stream throughput verified at 267.0 Mbps; frame error rate &le; 1.0e-6.
              </div>
              <div class="step-detail-box">
                <strong>Rollback / Safing:</strong> Automatic switch to spatial diversity link if packet loss exceeds 0.01%.
              </div>
            </div>
          </section>

          <section class="step-anchor" id="step-6">
            <h3>Step 06: Execute Post-Pass Terminal Safing &amp; Handover</h3>
            <p>Ramp down optical pump diodes, stow the fine steering mirror into launch locks, and transition tracking to DSN Ka-band backup.</p>
            <div class="step-details-grid">
              <div class="step-detail-box">
                <strong>Prerequisites:</strong> Downlink pass schedule window elapsed; telemetry buffer completely flushed.
              </div>
              <div class="step-detail-box">
                <strong>Telemetry Gate:</strong> Laser emission confirmed 0.0 mW; fine steering mirror caged at 0.0 &mu;rad center.
              </div>
              <div class="step-detail-box">
                <strong>Rollback / Safing:</strong> Ka-band carrier beacon acquisition confirmed prior to optical shutdown.
              </div>
            </div>
          </section>

          <!-- Emergency Abort & Operator Sign-Off -->
          <div class="doc4a-emergency-box" role="region" aria-label="Emergency Safing Callout">
            <div class="emergency-hdr"><i class="fa-solid fa-triangle-exclamation"></i> DIRECT DISENGAGE PROCEDURE: IMMEDIATE BEACON LOSS</div>
            <p>
              In the event of uncontrolled terminal slew exceeding 5.0 &mu;rad, the hardware crowbar immediately de-energizes the laser diode pump modules within 10 milliseconds, logging error code <code>ERR_OPT_SLEW_LIMIT</code> to the telemetry bus.
            </p>
          </div>

            <div><span>DSN STATIONS:</span> <strong>PALOMAR 5.1M / TABLE MTN</strong></div>
            <div><span>AUTHORIZATION:</span> <strong>MISSION PASS APPROVED</strong></div>
            <div><span>ARCHIVE SHA-256:</span> <code>9F4B3C...E018</code></div>
