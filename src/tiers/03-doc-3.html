        <div class="rfc-meta-grid">
          <div class="rfc-meta-col"><span>AUTHORITY:</span> Consultative Committee for Space Data Systems</div>
          <div class="rfc-meta-col"><span>WORKING GROUP:</span> Space Link Services Area (SLS-RFM)</div>

      <!-- Section 1.0: Scope & Normative Definition -->
      <section class="doc3-sec">
        <h2>1.0 Purpose &amp; Scope of Normative Specification</h2>
        <p>
          This document establishes the normative syntax, bitfield packet encoding, and state machine transition rules for the Space Packet Protocol (CCSDS 133.0-B-2). The protocol provides unidirectional or bidirectional data transfer services across deep space telemetry links, accommodating variable-length user application packets across optical and radio-frequency space-to-ground conduits.
        </p>
      </section>

      <!-- Section 2.0: 6-Byte Bitfield Primary Header SVG Diagram -->
      <section class="doc3-sec">
        <h2>2.0 Primary Header Structure &amp; 48-Bit Bitfield Architecture</h2>
        <p>
          Every Space Packet shall comprise a mandatory 6-byte (48-bit) Packet Primary Header, followed by an optional Packet Secondary Header and a variable-length Packet Data Field. Figure 3.1 details the exact bit allocation across the 6 octets:

                <tr data-clause="SHALL">
                  <td><code>REQ-SPP-01</code></td>
                  <td><span class="req-badge req-shall">SHALL</span></td>
                  <td>The Packet Version Number field shall occupy the three most significant bits of Octet 0 and shall be binary <code>000</code>.</td>
                  <td>Unit Bitmask Test</td>
                </tr>
                <tr data-clause="SHALL">
                  <td><code>REQ-SPP-02</code></td>
                  <td><span class="req-badge req-shall">SHALL</span></td>
                  <td>The Packet Type field shall be binary <code>0</code> for telemetry packets and binary <code>1</code> for telecommand packets.</td>
                  <td>Frame Inspection</td>
                </tr>
                <tr data-clause="SHALL">
                  <td><code>REQ-SPP-03</code></td>
                  <td><span class="req-badge req-shall">SHALL</span></td>
                  <td>The Application Process Identifier (APID) shall uniquely identify the spacecraft subsystem or instrument data source.</td>
                  <td>Routing Matrix</td>
                </tr>

                  <td>The APID value <code>0x07FF</code> (binary <code>11111111111</code>) must not be assigned to user science; it is reserved for Idle Packets.</td>
                  <td>Schema Validator</td>
                </tr>
                <tr data-clause="SHALL">
                  <td><code>REQ-SPP-05</code></td>
                  <td><span class="req-badge req-shall">SHALL</span></td>
                  <td>The Sequence Count field shall increment monotonically modulo 16,384 for each successive packet sharing an APID.</td>
                  <td>Sequence Checker</td>
                </tr>
                <tr data-clause="MUST-NOT">
                  <td><code>REQ-SPP-06</code></td>
                  <td><span class="req-badge req-mustnot">MUST NOT</span></td>
                  <td>The total length of any Space Packet must not exceed 65,542 octets including the 6-octet primary header.</td>
                  <td>Buffer Bounds Check</td>
                </tr>
                <tr data-clause="SHALL">
                  <td><code>REQ-SPP-07</code></td>
                  <td><span class="req-badge req-shall">SHALL</span></td>
                  <td>The Packet Data Length field value shall equal the total octets in the User Data Field minus one.</td>

                  <td><code>REQ-SPP-11</code></td>

                  <td>Bit Pattern Audit</td>

      <section class="doc3-sec">

        <p>
