        <header class="doc1-header">
          <div class="va-kicker"><i class="fa-solid fa-satellite"></i> Deep Space Optical Communications (DSOC) Monograph</div>
          <h1 class="doc1-title">Deep-Space 1550 nm Optical Transceiver Architecture &amp; Hybrid Ground Array Syntonization</h1>
          <div class="doc1-byline">
            <span>NASA Jet Propulsion Laboratory</span> &middot;
            <span>Space Technology Mission Directorate</span> &middot;
            <span>NTRS Citations 20240010475 / 20260007913</span>
          </div>
        </header>

        <!-- Abstract -->
        <section id="doc1-sec-abs" class="doc1-abstract-box">
          <p class="doc1-abstract-text">
            <strong>Abstract</strong> — The Psyche Deep Space Optical Communications (DSOC) technology demonstration represents the first operational implementation of photon-efficient optical downlink communications from interplanetary distances spanning 0.1 to 2.6 Astronomical Units (AU). This paper presents the end-to-end transceiver physical architecture, including the 22 cm clear-aperture flight optical assembly, active disturbance isolation assembly, and the cryogenic superconducting nanowire single-photon detector (SNSPD) array ground receiver at the Palomar 5.1 m Hale Telescope. Using Serially Concatenated Pulse Position Modulation (SCPPM, <i>M</i> = 4..128), the system achieved 267.0 Mbps at near conjunction and sustained high-rate carrier syntonization with sub-picosecond residual phase jitter across deep space.
          </p>
        </section>

        <!-- Section 1.0 -->
        <section id="doc1-sec-1">
          <h2>1.0 Flight Transceiver Configuration &amp; Disturbance Isolation</h2>
          <p>
            Operating an optical terminal across deep-space baselines requires angular point-ahead precision on the order of sub-microradians while isolating the laser transmitter from spacecraft reaction-wheel vibrations. The DSOC flight assembly integrates a 22 cm clear-aperture Cassegrain telescope supported by a magnetic hexapod disturbance isolation platform that attenuates high-frequency host spacecraft jitter above 2 Hz <sup class="cite-ref" onmouseenter="highlightDoc1Sidenote('sn-1', true)" onmouseleave="highlightDoc1Sidenote('sn-1', false)">[1]</sup>.
          </p>
          <p>
            Downlink optical power is generated by an erbium-doped fiber laser amplifier emitting 1.25 kW peak pulse power at 1550 nm. Uplink beacon acquisition and coarse pointing are established via Table Mountain Observatory using an arrayed 1064 nm beacon laser. The point-ahead mirror introduces calibrated relativistic compensation offsets up to &plusmn;33.4 &mu;rad along the trajectory vector <sup class="cite-ref" onmouseenter="highlightDoc1Sidenote('sn-2', true)" onmouseleave="highlightDoc1Sidenote('sn-2', false)">[2]</sup>.
          </p>
        </section>

          </p>

        <!-- Section 3.0 with Numbered Mathematical Equations -->
        <section id="doc1-sec-3">
          <h2>3.0 Phase Stability &amp; Mathematical Formulations</h2>
          <p>
            The frequency stability of the downstream slot clock is governed by the two-sample Modified Allan Variance <i>&sigma;<sub>y</sub></i><sup>2</sup>(<i>&tau;</i>), defined over <i>M</i> fractional frequency samples averaged over time interval <i>&tau;</i>:
          </p>
          <div class="doc1-equation" role="region" aria-label="Equation 1.1 Modified Allan Variance">
            <span>&sigma;<sub>y</sub><sup>2</sup>(&tau;) = [1 / 2(M &minus; 1)] &middot; &sum; (<span class="math-bar">y</span><sub>k+1</sub> &minus; <span class="math-bar">y</span><sub>k</sub>)<sup>2</sup></span>
            <span class="doc1-eq-num">(Eq. 1)</span>
          </div>
          <p>
            The free-space path loss <i>L</i><sub>free</sub> over interplanetary range <i>R</i> at carrier wavelength <i>&lambda;</i> = 1550 nm is expressed as:
          </p>
          <div class="doc1-equation" role="region" aria-label="Equation 1.2 Free-Space Geometric Loss">
            <span>L<sub>free</sub> = (4 &middot; &pi; &middot; R / &lambda;)<sup>2</sup> &nbsp;&nbsp;[dimensionless ratio]</span>
            <span class="doc1-eq-num">(Eq. 2)</span>
          </div>
          <p>
            Accounting for ground collector effective aperture <i>A</i><sub>eff</sub>, atmospheric transmittance <i>&eta;</i><sub>atm</sub>, and quantum photon energy <i>h&nu;</i>, the received signal photon flux <i>N</i><sub>rx</sub> per slot period <i>T</i><sub>s</sub> satisfies:
          </p>
          <div class="doc1-equation" role="region" aria-label="Equation 1.3 Received Signal Photon Flux">
            <span>N<sub>rx</sub> = (P<sub>tx</sub> &middot; G<sub>tx</sub> &middot; A<sub>eff</sub> &middot; &eta;<sub>atm</sub> &middot; T<sub>s</sub>) / (4 &middot; &pi; &middot; R<sup>2</sup> &middot; h &middot; &nu;)</span>
            <span class="doc1-eq-num">(Eq. 3)</span>
          </div>
          <p>
            Equation (3) reveals that high throughput at 2.6 AU requires minimizing slot width down to <i>T</i><sub>s</sub> = 500 ps while scaling ground receiver photon sensitivity via cryogenic detector arrays <sup class="cite-ref" onmouseenter="highlightDoc1Sidenote('sn-4', true)" onmouseleave="highlightDoc1Sidenote('sn-4', false)">[4]</sup>.
          </p>
        </section>

        <!-- Section 4.0: Ground Collector Architecture -->
        <section id="doc1-sec-4">
          <h2>4.0 Ground Segment Collector &amp; Palomar 5.1m SNSPD Array</h2>
          <p>
            Optical downlink reception is executed by the 5.1 m Hale Telescope at Palomar Mountain, supplemented by the Deep Space Network 34 m BWG hybrid RF-optical aperture (DSS-13) at Goldstone <sup class="cite-ref" onmouseenter="highlightDoc1Sidenote('sn-5', true)" onmouseleave="highlightDoc1Sidenote('sn-5', false)">[5]</sup>. The Palomar prime-focus optical receiver integrates a 64-element tungsten silicide (WSi) SNSPD array operated at a cryogenic temperature of 0.85 K inside a closed-cycle helium sorption refrigerator.
          </p>
          <p>
            Photon arrival events are timestamped by a high-resolution time-to-digital converter (TDC) with 8 ps bin resolution, feeding a soft-decision iterative BCJR decoder running on an array of field-programmable gate arrays (FPGAs) to decode the Serially Concatenated PPM stream <sup class="cite-ref" onmouseenter="highlightDoc1Sidenote('sn-6', true)" onmouseleave="highlightDoc1Sidenote('sn-6', false)">[6]</sup>.
          </p>
        </section>
