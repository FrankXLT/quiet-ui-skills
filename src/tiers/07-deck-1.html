      <!-- Deck Top Bar -->

            <span><i class="fa-solid fa-shield-halved"></i> Mission Critical Link</span>
            <span>&middot;</span>
            <span><i class="fa-solid fa-building-columns"></i> NASA SMD / SCaN Directorate</span>
            <span>&middot;</span>
            <span><i class="fa-solid fa-code-commit"></i> Release 4.2-FRR</span>

        </div>
        <div class="deck1-slide-controls">
          <span class="va-badge" id="deck1-counter-badge">SLIDE 01 / 04 · STEP 1/3</span>

            <button type="button" class="va-pill-btn deck1-slide-pill" onclick="setDeck1Slide(2)">02 Margin Waterfall</button>

        </div>
      </header>

      <!-- Main Deck Canvas -->
      <div class="deck1-canvas">
        <!-- Slide 1: Beam Taper & Far-Field Aperture Radiation -->
        <div id="deck1-viz-1" class="deck1-slide-view">
          <svg class="va-schematic-svg" viewBox="0 0 520 230" style="max-inline-size:520px;inline-size:100%;block-size:auto;display:block;" role="img" aria-label="Aperture Far-Field Radiation Beam Taper">

            <line x1="260" y1="20" x2="260" y2="190" stroke="var(--border-grid, #cbd5e1)" stroke-width="1" stroke-dasharray="3,3"/>

            <text class="va-svg-halo-text" x="260" y="24" text-anchor="middle" font-family="var(--font-mono)" font-size="15.2" font-weight="700" fill="var(--accent-primary, #2563eb)">Boresight (0.0 &mu;rad)</text>
          </svg>
          <div class="deck1-steps-list" aria-label="Narrative Step Cards">
            <div class="deck-step-card is-active" onclick="selectDeckStep(0)">
              <div class="step-title"><span>1.1 Boresight Lock</span><span class="mono">2.4 kHz</span></div>
              <p class="step-desc">Fine Pointing Loop closed via dual-axis piezo Fast Steering Mirror. Peak tracking centroid residual maintained within 0.42 &mu;rad RMS.</p>
            </div>
            <div class="deck-step-card" onclick="selectDeckStep(1)">
              <div class="step-title"><span>1.2 Sidelobe Taper</span><span class="mono">-44 dBc</span></div>
              <p class="step-desc">Dolph-Chebyshev aperture apodization attenuates secondary diffraction lobes, preventing cross-channel blinders on Palomar detectors.</p>
            </div>
            <div class="deck-step-card" onclick="selectDeckStep(2)">
              <div class="step-title"><span>1.3 Ephemeris Lead</span><span class="mono">12.4 &mu;rad</span></div>
              <p class="step-desc">Point-ahead angle dynamically synthesized from relativistic orbital kinematics to compensate for 16-minute light travel delays.</p>
            </div>
            <div class="deck1-slide-rubric" style="padding: 0.5rem; background: var(--bg-surface); border: 1px solid var(--border-hairline); border-radius: var(--radius-sm); font-size: 11px;">
              <div style="display: flex; justify-content: space-between; margin-bottom: 0.25rem;">
                <span class="mono" style="color: var(--text-secondary);"><i class="fa-solid fa-stamp"></i> FRR-GATE-01</span>
                <span class="mono" style="color: var(--status-ok, #16a34a); font-weight: 700;">PASSED // AIRWORTHY</span>
              </div>
              <div style="color: var(--text-secondary); line-height: 1.35; margin-bottom: 0.35rem;">
                Pointing jitter residual &le; 0.50 &mu;rad verified across 12 thermal cycle orbits in vacuum chamber HIL-6.
              </div>
              <div class="mono" style="font-size:11px; color: var(--text-secondary); border-top: 1px dashed var(--border-hairline); padding-top: 0.25rem;">
                <span>Wavelength: 1550 nm &middot; Format: M=64 SCPPM &middot; Jitter Margin: +4.2 dB</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Slide 2: Link Margin Waterfall Chart -->
        <div id="deck1-viz-2" class="deck1-slide-view" style="display:none;">

              <p class="step-desc">Geometric spherical spreading loss across 2.6 AU cruise range. Mitigated by low-divergence 1550nm diffraction-limited optics.</p>
            </div>
            <div class="deck-step-card" onclick="selectDeckStep(1)">
              <div class="step-title"><span>2.2 Palomar Collection</span><span class="mono">+132.8 dBi</span></div>
              <p class="step-desc">Hale 200-inch primary collector paired with real-time deformable mirror adaptive optics achieves Strehl ratio &ge; 0.68.</p>
            </div>
            <div class="deck-step-card" onclick="selectDeckStep(2)">
              <div class="step-title"><span>2.3 Link Closure</span><span class="mono">+6.0 dB</span></div>
              <p class="step-desc">Atmospheric scintillation margin is fully closed, exceeding the mission KDP-C threshold requirement of +3.0 dB by 2x.</p>
            </div>
            <div class="deck1-slide-rubric" style="padding: 0.5rem; background: var(--bg-surface); border: 1px solid var(--border-hairline); border-radius: var(--radius-sm); font-size: 11px;">
              <div style="display: flex; justify-content: space-between; margin-bottom: 0.25rem;">
                <span class="mono" style="color: var(--text-secondary);"><i class="fa-solid fa-stamp"></i> FRR-GATE-02</span>
                <span class="mono" style="color: var(--status-ok, #16a34a); font-weight: 700;">PASSED // VERIFIED</span>
              </div>
              <div style="color: var(--text-secondary); line-height: 1.35; margin-bottom: 0.35rem;">
                Worst-case solar conjunction scintillation margin measured at +4.8 dB; link closure margin confirmed positive.
              </div>
              <div class="mono" style="font-size:11px; color: var(--text-secondary); border-top: 1px dashed var(--border-hairline); padding-top: 0.25rem;">

            <text class="va-svg-halo-text" x="430" y="148" text-anchor="middle" font-family="var(--font-sans)" font-size="15.2" font-weight="600" fill="var(--status-ok, #16a34a)">DSN Hybrid Antennas</text>

              <div class="step-title"><span>3.1 Science Demand</span><span class="mono">High-Rate</span></div>
              <p class="step-desc">Next-generation hyperspectral imagers and SAR suites require multi-Gbps downlink, shifting optical from novelty to mission lifeline.</p>
            </div>
            <div class="deck-step-card" onclick="selectDeckStep(1)">
              <div class="step-title"><span>3.2 Protocol Standard</span><span class="mono">CCSDS 133.0</span></div>
              <p class="step-desc">Interoperable Blue Book framing standardizes synchronization, pseudo-randomization, and soft-decision decoding across international partners.</p>
            </div>

              <div class="step-title"><span>3.3 Ground Commoditization</span><span class="mono">Hybrid DSN</span></div>

              <div style="display: flex; justify-content: space-between; margin-bottom: 0.25rem;">
                <span class="mono" style="color: var(--text-secondary);"><i class="fa-solid fa-stamp"></i> FRR-GATE-03</span>
                <span class="mono" style="color: var(--status-ok, #16a34a); font-weight: 700;">PASSED // STANDARDIZED</span>
              </div>
              <div style="color: var(--text-secondary); line-height: 1.35; margin-bottom: 0.35rem;">

              </div>

              </div>
            </div>

        </div>

        <!-- Slide 4: Photon-to-Archive Telemetry Flow -->

            <text class="va-svg-halo-text" x="480" y="42" text-anchor="end" font-family="var(--font-mono)" font-size="15.2" fill="var(--status-err, #dc2626)">Fade Losses (3.2%)</text>

              <p class="step-desc">High-rate telemetry streamed from solid-state flight recorder across high-speed serial transceiver fabric with zero frame dropouts.</p>

              <div class="step-title"><span>4.2 Cryo Demodulation</span><span class="mono">0.85 K</span></div>
              <p class="step-desc">Superconducting nanowire single-photon detector array resolves discrete photon arrival events with sub-50 picosecond timing resolution.</p>
            </div>

              <div class="step-title"><span>4.3 Planetary Archive</span><span class="mono">PDS Level-0</span></div>
