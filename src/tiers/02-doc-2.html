      <!-- Section 1.0: Executive Mandate -->
      <section class="doc2-sec">
        <h2>1.0 Executive Mandate &amp; Strategic Context</h2>
        <p>
          NASA Space Technology Mission Directorate (STMD) established the Deep Space Optical Communications project to address the bandwidth bottleneck of deep space telemetry. As scientific imaging and hyperspectral instruments generate tens of terabytes per mission conjunction, traditional Ka-band radio frequency (RF) downlinks operating between 500 kbps and 2 Mbps impose severe data discard policies.
        </p>
        <p>
          Following successful in-flight demonstration of 267 Mbps at close range and 1.0 Mbps at 2.6 AU, this memorandum codifies the formal approval of Option B: Hybrid Optical/RF Architecture as the standard flight baseline for outer-planet missions.
        </p>
      </section>

      <!-- Section 3.0: Risk Matrix Callout -->
      <section class="doc2-sec">
        <h2>3.0 Risk Assessment &amp; Cloud Attenuation Mitigations</h2>
        <div class="risk-left-bar" role="alert" aria-label="Risk Mitigation Analysis">
          <div class="risk-title"><i class="fa-solid fa-triangle-exclamation"></i> Risk Profile: Terrestrial Cloud Cover &amp; Atmospheric Scintillation</div>
          <p>
            The primary failure mode for optical telemetry is cloud cover obscuring ground collectors. Atmospheric transmission drops to &lt; 5% during dense cloud cover over a single facility.
          </p>
          <div class="risk-mitigation-grid">
            <div class="risk-mit-item">
              <strong>Spatial Diversity Array:</strong> Dual-site spatial separation between Palomar Observatory and Goldstone Deep Space Communications Complex guarantees <strong>99.4% aggregate availability</strong>.
            </div>
            <div class="risk-mit-item">
              <strong>Autonomous Ka-Band Fallback:</strong> If optical beacon lock is interrupted for &gt; 30 seconds, flight firmware autonomously commutates critical health and safety telemetry to legacy Ka-band.
            </div>
          </div>
        </div>
      </section>
