<template id="tpl-tier-app-4" data-tier="app-4" data-num="11" data-title="App-4 · Mission Timeline Planner" data-family="C" data-allowed-navs="n1,n2,n4" data-default-nav="n1">
  <section id="tier-app-4" class="va-tier va-tier-app-4" aria-label="11 · App-4 Mission Timeline Planner">
    <div class="app4-workspace">
      <!-- Top Operational Header & Focus Hero Widget -->
      <header class="app4-header" style="display:flex;flex-direction:column;gap:8px;">
        <div class="va-status-strip" style="background:var(--bg-elevated);border:1px solid var(--border-hairline);border-radius:var(--radius-card);padding:8px 12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;font-size:12px;">
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="va-badge"><i class="fa-solid fa-calendar-day"></i> NRHO-FLIGHT-OPS</span>
            <span id="app4-progress-label" style="font-weight:600;color:var(--text-primary);">
              Orbit 142 &middot; NRHO Perilune Window &middot; 2 of 8 Tasks Complete
            </span>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <button type="button" class="va-pill-btn" onclick="document.getElementById('app4-backlog-drawer').showModal()" style="font-size:11px;">
              <i class="fa-solid fa-inbox"></i> Staging Inbox (5)
            </button>
            <button type="button" class="va-pill-btn" onclick="document.getElementById('app4-conflict-dialog').showModal()" style="font-size:11px;color:var(--status-warn,#d97706);">
              <i class="fa-solid fa-triangle-exclamation"></i> 1 Conflict
            </button>
          </div>
        </div>

        <!-- Focus Timer Hero Widget & Quick Capture Strip -->

            <div style="display:flex;flex-direction:column;">
              <span class="mono" style="font-size:11px;color:var(--text-muted);text-transform:uppercase;">Active Flight Focus Block</span>
              <strong style="font-size:13px;color:var(--text-primary);"><i class="fa-solid fa-stopwatch"></i> NRHO Perilune Maneuver Execution</strong>
            </div>
            <div class="mono" id="focus-timer-digits" style="font-size:24px;font-weight:700;color:var(--accent-primary,#2563eb);background:var(--bg-elevated);padding:2px 10px;border-radius:var(--radius-sm);border:1px solid var(--border-hairline);letter-spacing:1px;">
              45:00

            <div style="display:flex;gap:4px;">

              </button>
              <button type="button" class="va-pill-btn" onclick="adjustFocusTimer(5)" style="font-size:11px;">+5m</button>
              <button type="button" class="va-pill-btn" onclick="adjustFocusTimer(-5)" style="font-size:11px;">-5m</button>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:6px;flex:1 1 240px;max-width:380px;">
            <input type="text" placeholder="Press '/' to quick-stage new flight task..." class="mono" style="inline-size:100%;font-size:11.5px;padding:6px 10px;background:var(--bg-elevated);border:1px solid var(--border-hairline);border-radius:var(--radius-sm);color:var(--text-primary);" aria-label="Quick Task Entry">
          </div>
        </div>
      </header>

      <!-- Dual-Pane Structured Task & Timeline Workspace -->
      <div class="app4-dual-pane" style="margin-top:8px;">
        <!-- Left Pane: Scheduled Crew & Flight Tasks -->
        <div class="va-card app4-tasks-card" style="background:var(--bg-surface);border:1px solid var(--border-hairline);border-radius:var(--radius-card);padding:12px;">

            <strong style="font-size:13px;color:var(--text-primary);">
              <i class="fa-solid fa-list-check"></i> Scheduled Flight Operations Tasks
            </strong>
            <span class="mono" style="font-size:11px;color:var(--text-secondary);">NRHO Rev 142 Pass</span>
          </div>

          <div class="app4-task-list" style="display:flex;flex-direction:column;gap:6px;">
            <label class="app4-task-row" style="display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:6px;background:var(--bg-elevated);cursor:pointer;">
              <input type="checkbox" checked onchange="toggleApp4Task(this)" style="margin-top:3px;" />
              <div style="flex:1;">
                <span style="font-size:12px;font-weight:600;color:var(--text-primary);display:block;">NRHO Orbit Trim Maneuver (OTM-14)</span>

            <label class="app4-task-row" style="display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:6px;background:var(--bg-elevated);cursor:pointer;">
              <input type="checkbox" checked onchange="toggleApp4Task(this)" style="margin-top:3px;" />
              <div style="flex:1;">
                <span style="font-size:12px;font-weight:600;color:var(--text-primary);display:block;">ECLSS Atmospheric Partial Pressure Log</span>
                <span class="mono" style="font-size:11px;color:var(--text-secondary);">09:30 UTC &middot; ppO2 21.2 kPa &middot; ppCO2 1.8 mmHg</span>
              </div>
              <span class="va-badge" style="color:var(--status-ok,#16a34a);font-size:11px;">DONE</span>

                <span class="mono" style="font-size:11px;color:var(--text-secondary);">11:00 UTC &middot; 1064nm Table Mountain Uplink &middot; 0.38 &mu;rad</span>
              </div>
              <span class="va-badge" style="color:var(--accent-primary,#2563eb);font-size:11px;">ACTIVE</span>
            </label>

            <label class="app4-task-row" style="display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:6px;background:var(--bg-elevated);cursor:pointer;">
              <input type="checkbox" onchange="toggleApp4Task(this)" style="margin-top:3px;" />
              <div style="flex:1;">
                <span style="font-size:12px;font-weight:600;color:var(--text-primary);display:block;">PPE Solar Array Alpha Gimbal Angle Sweep</span>
                <span class="mono" style="font-size:11px;color:var(--text-secondary);">13:45 UTC &middot; Bearing microphonic vibration check</span>
              </div>
              <span class="va-badge" style="font-size:11px;">QUEUED</span>
            </label>

            <label class="app4-task-row" style="display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:6px;background:var(--bg-elevated);cursor:pointer;">
              <input type="checkbox" onchange="toggleApp4Task(this)" style="margin-top:3px;" />
              <div style="flex:1;">
                <span style="font-size:12px;font-weight:600;color:var(--text-primary);display:block;">HALO Avionics Bus Telemetry Sync</span>
                <span class="mono" style="font-size:11px;color:var(--text-secondary);">15:30 UTC &middot; MIL-STD-1553 Bridge dump &middot; 128 MB</span>
              </div>
              <span class="va-badge" style="font-size:11px;">QUEUED</span>
            </label>

            <label class="app4-task-row" style="display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:6px;background:var(--bg-elevated);cursor:pointer;">
              <input type="checkbox" onchange="toggleApp4Task(this)" style="margin-top:3px;" />
              <div style="flex:1;">
                <span style="font-size:12px;font-weight:600;color:var(--text-primary);display:block;">Sortie-2 Suit Umbilical Pre-Breathing Protocol</span>

              </div>
              <span class="va-badge" style="font-size:11px;">PRE-SORTIE</span>
            </label>

            <label class="app4-task-row" style="display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:6px;background:var(--bg-elevated);cursor:pointer;">
              <input type="checkbox" onchange="toggleApp4Task(this)" style="margin-top:3px;" />
              <div style="flex:1;">
                <span style="font-size:12px;font-weight:600;color:var(--text-primary);display:block;">Gateway S-Band Backup Transponder Bit Error Test</span>
                <span class="mono" style="font-size:11px;color:var(--text-secondary);">19:15 UTC &middot; Madrid DSS-54 loopback verification</span>
              </div>
              <span class="va-badge" style="font-size:11px;">ROUTINE</span>
            </label>

            <label class="app4-task-row" style="display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:6px;background:var(--bg-elevated);cursor:pointer;">
              <input type="checkbox" onchange="toggleApp4Task(this)" style="margin-top:3px;" />
              <div style="flex:1;">
                <span style="font-size:12px;font-weight:600;color:var(--text-primary);display:block;">SNSPD Cryostat Cold Head Regeneration Purge</span>
                <span class="mono" style="font-size:11px;color:var(--text-secondary);">21:00 UTC &middot; Sub-Kelvin sorption cooler bake-out</span>
              </div>
              <span class="va-badge" style="font-size:11px;">POST-PASS</span>
            </label>
          </div>
        </div>

        <!-- Right Pane: Hourly NRHO Mission Timeline Windows -->
        <div class="va-card app4-blocks-card" style="background:var(--bg-surface);border:1px solid var(--border-hairline);border-radius:var(--radius-card);padding:12px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;border-bottom:1px solid var(--border-hairline);padding-bottom:6px;">
            <strong style="font-size:13px;color:var(--text-primary);">
              <i class="fa-solid fa-clock"></i> 24-Hour Orbital Flight Windows
            </strong>
            <span class="mono" style="font-size:11px;color:var(--text-secondary);">UTC Orbit Timeline</span>
          </div>

          <div style="display:flex;flex-direction:column;gap:8px;">
            <!-- Window 1 -->
            <div class="va-panel-tonal" style="padding:10px;border-radius:6px;background:var(--bg-elevated);border-left:3px solid var(--accent-primary,#2563eb);">
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <span style="font-size:12px;font-weight:600;color:var(--text-primary);">Perilune Passage &amp; DSN Madrid Handover</span>
                <span class="mono" style="font-size:11px;color:var(--status-ok,#16a34a);">08:00 - 10:30 UTC</span>
              </div>
              <p style="margin:4px 0 0;font-size:11.5px;color:var(--text-secondary);line-height:1.4;">
                DSS-55 BWG contact active. Tracking Doppler range rate 1.42 km/s. Primary RF telemetry locked; OTM-14 completed.
              </p>
            </div>

            <!-- Window 2 -->
            <div class="va-panel-tonal" style="padding:10px;border-radius:6px;background:var(--bg-elevated);border-left:3px solid var(--status-ok,#16a34a);">
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <span style="font-size:12px;font-weight:600;color:var(--text-primary);">ECLSS Cabin Scrubbing &amp; Regeneration</span>
                <span class="mono" style="font-size:11px;color:var(--text-secondary);">11:00 - 14:00 UTC</span>
              </div>
              <p style="margin:4px 0 0;font-size:11.5px;color:var(--text-secondary);line-height:1.4;">
                Amine bed thermal desorption cycle. Nominal ppCO2 maintained &le; 2.1 mmHg across HALO habitability module.
              </p>
            </div>

            <!-- Window 3 -->
            <div class="va-panel-tonal" style="padding:10px;border-radius:6px;background:var(--bg-elevated);border-left:3px solid var(--accent-primary,#2563eb);">
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <span style="font-size:12px;font-weight:600;color:var(--text-primary);">Deep Space Optical Downlink Window (Palomar)</span>
                <span class="mono" style="font-size:11px;color:var(--accent-primary,#2563eb);">14:30 - 18:00 UTC</span>
              </div>
              <p style="margin:4px 0 0;font-size:11.5px;color:var(--text-secondary);line-height:1.4;">
                Hale 5.08m receiver pass. Scheduled science downlink volume 18.4 TB at 267.0 Mbps SCPPM rate.
              </p>
            </div>

            <!-- Window 4 -->
            <div class="va-panel-tonal" style="padding:10px;border-radius:6px;background:var(--bg-elevated);border-left:3px solid var(--status-warn,#d97706);">
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <span style="font-size:12px;font-weight:600;color:var(--text-primary);">Lunar Eclipse &amp; Battery Depletion Phase</span>
                <span class="mono" style="font-size:11px;color:var(--status-warn,#d97706);">18:30 - 20:15 UTC</span>
              </div>
              <p style="margin:4px 0 0;font-size:11.5px;color:var(--text-secondary);line-height:1.4;">
                Solar array shadow transit. Lithium-ion batteries provide 42 kW continuous load. Science payloads throttled.
              </p>
            </div>

            <!-- Window 5 -->
            <div class="va-panel-tonal" style="padding:10px;border-radius:6px;background:var(--bg-elevated);border-left:3px solid #64748b;">
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <span style="font-size:12px;font-weight:600;color:var(--text-primary);">Crew Protected Rest Period (Apolune Phase)</span>
                <span class="mono" style="font-size:11px;color:var(--text-secondary);">21:00 - 05:00 UTC</span>
              </div>
              <p style="margin:4px 0 0;font-size:11.5px;color:var(--text-secondary);line-height:1.4;">
                Autonomous health and status monitoring. Circadian lighting dimmed to 2700K; cabin acoustic levels &le; 40 dBA.
              </p>
            </div>
          </div>
        </div>
      </div>

      <!-- Backlog Modal Drawer -->
      <dialog id="app4-backlog-drawer" style="max-width:440px;width:90vw;border:1px solid var(--border-hairline);border-radius:var(--radius-card);padding:16px;background:var(--bg-surface);color:var(--text-primary);box-shadow:0 16px 32px rgba(0,0,0,0.25);">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;border-bottom:1px solid var(--border-hairline);padding-bottom:8px;">
          <h3 style="font-size:14px;margin:0;font-weight:600;"><i class="fa-solid fa-inbox"></i> Unscheduled Backlog Staging (5 Items)</h3>
          <button type="button" class="va-pill-btn" onclick="document.getElementById('app4-backlog-drawer').close()" style="font-size:11px;">Close &times;</button>
        </div>
        <p style="font-size:11.5px;color:var(--text-secondary);margin:0 0 10px 0;">Staged tasks awaiting perilune pass completion:</p>
        <div style="display:flex;flex-direction:column;gap:8px;">
          <div class="va-panel-tonal" style="padding:8px 10px;border-radius:6px;background:var(--bg-elevated);font-size:12px;">
            <strong style="color:var(--text-primary);display:block;">Secondary Nitrogen Repress Tank Recalibration</strong>
            <span class="mono" style="font-size:11px;color:var(--text-secondary);">Effector: N2-VALVE-02 &middot; Priority: Routine</span>
          </div>
          <div class="va-panel-tonal" style="padding:8px 10px;border-radius:6px;background:var(--bg-elevated);font-size:12px;">

            <span class="mono" style="font-size:11px;color:var(--text-secondary);">Subsystem: RF Comms &middot; Priority: Routine</span>
          </div>
          <div class="va-panel-tonal" style="padding:8px 10px;border-radius:6px;background:var(--bg-elevated);font-size:12px;">
            <strong style="color:var(--text-primary);display:block;">Suit Umbilical Leak Rate Check</strong>
            <span class="mono" style="font-size:11px;color:var(--text-secondary);">Airlock Module &middot; Priority: Pre-Sortie</span>
          </div>
          <div class="va-panel-tonal" style="padding:8px 10px;border-radius:6px;background:var(--bg-elevated);font-size:12px;">

            <span class="mono" style="font-size:11px;color:var(--text-secondary);">ECLSS: Water Loop &middot; Priority: Routine</span>

      <!-- Conflict Warning Modal Dialog -->

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;border-bottom:1px solid var(--border-hairline);padding-bottom:6px;">
          <h3 style="font-size:14px;margin:0;font-weight:600;color:var(--status-warn,#d97706);">

        <p style="font-size:12px;line-height:1.4;color:var(--text-secondary);margin:0 0 10px 0;">
          <strong>Conflict Detected at 14:30 UTC:</strong> Scheduled DSOC 1550nm Laser Emission window directly overlaps with RCS Thruster Desaturation Plume Exclusion Zone.
        </p>
        <div style="padding:8px;background:var(--bg-elevated);border-radius:6px;font-size:11px;margin-bottom:12px;">
          <span class="mono" style="display:block;color:var(--status-warn,#d97706);font-weight:600;">RECOMMENDED ACTION:</span>
          <span>Delay RCS desaturation by +25 minutes to clear optical beam path and maintain pointing jitter &le; 0.42 &mu;rad.</span>

      <!-- Footer -->

        <span>NASA NTRS 20240016087 &middot; Gateway Mission Operations &amp; NRHO Orbit Schedule</span>
