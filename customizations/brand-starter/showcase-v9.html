<!DOCTYPE html>
<html lang="en" class="va-studio-root" data-medium="auto" data-studio-view="worlds" data-custom-styles="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiet UI Brand &amp; Product Portal — Quiet UI Showcase</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">
  <style id="va-studio-chrome-css">
/* SPDX-License-Identifier: Apache-2.0 */
/* Quiet UI v9.0 — Studio Portal Bar, Mat, Scaler & Quiet-Bridge Provenance Dialog */

html.va-studio-root,
body.va-studio-body {
  margin: 0;
  padding: 0;
  block-size: 100dvh;
  inline-size: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #070B12;
  color: #F8FAFC;
  font-size: 13px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
}

*, *::before, *::after { box-sizing: border-box; }
summary { list-style: none; }
summary::-webkit-details-marker { display: none; }

#va-studio-bar,
.va-studio-bar {
  block-size: 44px;
  min-block-size: 44px;
  max-block-size: 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: nowrap;
  gap: 0.35rem;
  padding: 0 0.5rem;
  background: #0F172A;
  border-bottom: 1px solid #1E293B;
  z-index: 100;
  flex-shrink: 0;
  overflow: hidden;
  transition: margin-top 0.18s ease, transform 0.18s ease;
}

#va-studio-bar.is-tucked {
  margin-top: -44px;
  transform: translateY(-100%);
}

.va-bar-left,
.va-bar-right {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  flex: 0 0 auto;
  min-inline-size: 0;
}

.va-bar-center {
  display: flex;
  align-items: center;
  gap: 0.22rem;
  flex: 1 1 auto;
  min-inline-size: 0;
  max-inline-size: 360px;
}

.va-studio-brand {
  font-weight: 700;
  font-size: 12.5px;
  color: #F8FAFC;
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  white-space: nowrap;
}
.va-brand-icon { inline-size: 18px; text-align: center; color: #38BDF8; font-size: 13px; }
.va-brand-text { display: inline-flex; align-items: center; gap: 0.3rem; }
.va-studio-badge {
  font-size: 11px;
  font-weight: 600;
  background: #1E293B;
  color: #38BDF8;
  padding: 1px 5px;
  border-radius: 4px;
  border: 1px solid #334155;
}

.va-step-btn {
  min-block-size: 30px;
  inline-size: 26px;
  padding: 0;
  border: 1px solid #334155;
  border-radius: 6px;
  background: #1E293B;
  color: #CBD5E1;
  font-size: 11px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
}
.va-step-btn:hover { background: #334155; color: #FFFFFF; }

.va-studio-select,
.va-studio-btn {
  min-block-size: 30px;
  padding: 0.15rem 0.45rem;
  border: 1px solid #334155;
  border-radius: 6px;
  background: #1E293B;
  color: #F1F5F9;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.28rem;
  white-space: nowrap;
  font-family: inherit;
}
.va-tier-select {
  inline-size: 100%;
  min-inline-size: 0;
  flex: 1 1 auto;
  overflow: hidden;
  text-overflow: ellipsis;
}
.va-studio-select:hover,
.va-studio-btn:hover { background: #334155; }
.va-studio-btn.is-active,
.va-studio-btn[aria-pressed="true"] {
  background: #2563EB;
  border-color: #60A5FA;
  color: #FFFFFF;
}

.va-inline-ctrl {
  display: inline-flex;
  align-items: center;
  gap: 0.22rem;
  min-block-size: 30px;
  padding: 0 0.38rem;
  border: 1px solid #334155;
  border-radius: 6px;
  background: #1E293B;
  color: #CBD5E1;
  font-size: 11.5px;
  white-space: nowrap;
}
.va-world-ctrl { max-inline-size: 215px; }
.va-world-ctrl .va-ctrl-bare-select { max-inline-size: 155px; overflow: hidden; text-overflow: ellipsis; }
.va-ctrl-prefix { color: #94A3B8; font-weight: 600; font-size: 11px; }
.va-ctrl-bare-select {
  border: 0;
  background: transparent;
  color: #F8FAFC;
  font-size: 12px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  outline: none;
  padding-right: 0.12rem;
}
.va-ctrl-bare-select option { background: #0F172A; color: #F8FAFC; }

.va-theme-dots {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 0 0.3rem;
  min-block-size: 30px;
  background: #070B12;
  border: 1px solid #1E293B;
  border-radius: 999px;
}
.va-theme-dot {
  inline-size: 16px;
  block-size: 16px;
  padding: 0;
  border-radius: 999px;
  border: 1.5px solid #475569;
  cursor: pointer;
}
.va-theme-dot[data-theme-dot="white"] { background: #FFFFFF; }
.va-theme-dot[data-theme-dot="paper"] { background: #F5F2EB; }
.va-theme-dot[data-theme-dot="dark-paper"] { background: #262420; }
.va-theme-dot[data-theme-dot="dark"] { background: #090D16; }
.va-theme-dot.is-active {
  box-shadow: 0 0 0 2px #070B12, 0 0 0 3.5px #38BDF8;
  border-color: #FFFFFF;
}

.va-gear-btn { position: relative; min-inline-size: 30px; }
.va-settings-dot {
  position: absolute;
  top: 4px;
  right: 4px;
  inline-size: 6px;
  block-size: 6px;
  border-radius: 999px;
  background: #38BDF8;
}
.va-stage-tools { display: inline-flex; align-items: center; gap: 0.25rem; }
.va-stage-tools[hidden],
.va-settings-dot[hidden] { display: none; }

.va-btn-lbl-wide { display: none; }
.va-btn-lbl-short { display: inline; }
@media (min-width: 1280px) {
  .va-btn-lbl-wide { display: inline; }
  .va-btn-lbl-short { display: none; }
}
@media (max-width: 699px) {
  .va-studio-brand, .va-fold-up, .va-desktop-only, .va-btn-lbl { display: none; }
  .va-phone-only { display: inline-flex; }
}
@media (min-width: 700px) and (max-width: 1099px) {
  .va-brand-text, .va-phone-only, .va-desktop-only { display: none; }
  .va-world-ctrl { max-inline-size: 165px; }
  .va-world-ctrl .va-ctrl-bare-select { max-inline-size: 108px; }
}
@media (min-width: 1100px) {
  .va-phone-only { display: none; }
}

.va-mode-tablist {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 2px;
  background: #070B12;
  border: 1px solid #1E293B;
  border-radius: 7px;
}
.va-mode-tab {
  min-block-size: 26px;
  padding: 0 0.55rem;
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: #94A3B8;
  font: 600 11.5px/1 inherit;
  cursor: pointer;
  white-space: nowrap;
}
.va-mode-tab:hover { color: #F8FAFC; }
.va-mode-tab[aria-selected="true"],
.va-mode-tab.is-active {
  background: #1E293B;
  color: #38BDF8;
}
html[data-studio-view="bench"] :is(.va-world-ctrl, .va-bar-center, #va-sheet-toggle-btn, #va-bridge-btn, .va-nav-ctrl, #va-print-btn, .va-worlds-only),
html[data-studio-view="atlas"] :is(.va-world-ctrl, .va-bar-center, #va-sheet-toggle-btn, #va-bridge-btn, .va-nav-ctrl, #va-print-btn, .va-worlds-only, .va-atlas-hide) {
  display: none;
}
@media (max-width: 699px) {
  .va-mode-tab { padding: 0 0.36rem; font-size: 10.5px; }
}
@media (max-width: 519px) {
  #va-studio-bar, .va-studio-bar { padding: 0 0.3rem; gap: 0.2rem; }
  .va-bar-left, .va-bar-right { gap: 0.2rem; }
  .va-mode-tab { padding: 0 0.3rem; font-size: 10px; }
  .va-step-btn { inline-size: 22px; }
  #va-bridge-btn .va-btn-lbl-short { display: none; }
  .va-studio-btn { padding: 0.15rem 0.35rem; }
}

#va-portal-mat {
  flex: 1;
  min-block-size: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  background: #070B12;
  user-select: none;
}

#va-portal-scaler {
  position: relative;
  box-shadow: 0 20px 48px rgba(0, 0, 0, 0.55);
  transition: width 0.12s ease-out, height 0.12s ease-out;
  background: #090D16;
}

#va-stage-portal {
  border: none;
  background: #090D16;
  display: block;
}

.va-hinge-guide {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  width: 2px;
  transform: translateX(-50%);
  border-left: 2px dashed rgba(56, 189, 248, 0.65);
  pointer-events: none;
  z-index: 25;
  display: none;
}
#va-portal-scaler.has-hinge .va-hinge-guide { display: block; }

.va-drag-handle { position: absolute; z-index: 30; }
.va-drag-w { left: -6px; top: 0; bottom: 0; width: 12px; cursor: ew-resize; }
.va-drag-e { right: -6px; top: 0; bottom: 0; width: 12px; cursor: ew-resize; }
.va-drag-s { bottom: -6px; left: 0; right: 0; height: 12px; cursor: ns-resize; }

dialog#va-customize-sheet,
dialog#va-bridge-dialog {
  border: 1px solid #334155;
  background: #0F172A;
  color: #F8FAFC;
  padding: 0.95rem 1.05rem;
  box-shadow: 0 24px 56px rgba(0, 0, 0, 0.62);
  border-radius: 10px;
  overflow-y: auto;
}
dialog#va-customize-sheet:modal,
dialog#va-bridge-dialog:modal { overscroll-behavior: contain; }
dialog#va-customize-sheet::backdrop,
dialog#va-bridge-dialog::backdrop {
  background: rgba(7, 11, 18, 0.62);
  backdrop-filter: blur(3px);
  overflow: hidden;
  overscroll-behavior: contain;
}
dialog#va-customize-sheet {
  margin: 50px 0.65rem auto auto;
  inline-size: 372px;
  max-inline-size: calc(100vw - 1.3rem);
  max-block-size: calc(100dvh - 64px);
}
dialog#va-bridge-dialog {
  margin: auto;
  inline-size: min(92vw, 820px);
  max-block-size: calc(100dvh - 48px);
}
@media (max-width: 699px) {
  dialog#va-customize-sheet {
    margin: auto 0 0 0;
    inline-size: 100%;
    max-inline-size: 100%;
    max-block-size: 84dvh;
    border-radius: 14px 14px 0 0;
    border-bottom: 0;
  }
}

.va-customize-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 0.75rem;
  margin-bottom: 0.75rem;
  padding-bottom: 0.5rem;
  border-bottom: 1px solid #1E293B;
  font-size: 13px;
}
.va-bridge-hdr-copy { display: flex; flex-direction: column; gap: 0.15rem; }
.va-bridge-hdr-copy strong { font-size: 15px; color: #F8FAFC; }
.va-sheet-sections,
.va-bridge-body { display: flex; flex-direction: column; gap: 0.75rem; }
.va-customize-field { display: flex; flex-direction: column; gap: 0.3rem; }
.va-customize-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
.va-customize-label { font-size: 11px; font-weight: 700; color: #94A3B8; text-transform: uppercase; letter-spacing: 0.05em; }
.va-sheet-seg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.3rem; }
.va-sheet-seg-btn {
  min-block-size: 32px;
  padding: 0.2rem 0.35rem;
  border: 1px solid #334155;
  border-radius: 6px;
  background: #1E293B;
  color: #CBD5E1;
  font-size: 11.5px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
}
.va-sheet-seg-btn.is-active { background: #2563EB; border-color: #3B82F6; color: #FFFFFF; }
.va-sheet-stage-row,
.va-prompt-row { display: flex; align-items: center; gap: 0.35rem; }
.va-sheet-stage-row .va-studio-select { flex: 1 1 auto; }
.va-prompt-preview {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  color: #94A3B8;
  background: #070B12;
  border: 1px solid #1E293B;
  border-radius: 5px;
  padding: 0.35rem 0.5rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1 1 auto;
}

.va-bridge-card {
  background: #0B1220;
  border: 1px solid #1E293B;
  border-radius: 8px;
  padding: 0.7rem 0.85rem;
  display: flex;
  flex-direction: column;
  gap: 0.45rem;
}
.va-bridge-card h3 { margin: 0; font-size: 12px; font-weight: 700; color: #38BDF8; text-transform: uppercase; letter-spacing: 0.04em; }
.va-bridge-vector { font-size: 13px; color: #F8FAFC; font-weight: 600; }
.va-bridge-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 0.5rem; }
.va-bridge-item { background: #111B2E; border: 1px solid #1E293B; border-radius: 6px; padding: 0.5rem 0.6rem; font-size: 12px; color: #CBD5E1; }
.va-bridge-item strong { display: block; font-size: 11px; color: #94A3B8; margin-bottom: 0.18rem; text-transform: uppercase; }
.va-bridge-table-wrap { overflow-x: auto; border: 1px solid #1E293B; border-radius: 6px; }
.va-bridge-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
.va-bridge-table th,
.va-bridge-table td { padding: 0.38rem 0.55rem; text-align: left; border-bottom: 1px solid #1E293B; color: #CBD5E1; vertical-align: top; }
.va-bridge-table th { background: #111B2E; color: #94A3B8; font-weight: 700; font-size: 11px; text-transform: uppercase; }
.va-bridge-pass { color: #CBD5E1; font-family: ui-monospace, monospace; font-weight: 600; }

@media print {
  #va-studio-bar, dialog#va-customize-sheet, dialog#va-bridge-dialog, .va-hinge-guide, .va-drag-handle { display: none; }
}

  </style>
  <link rel="stylesheet" href="./styles/quiet-ui-tokens.css" />
  <link rel="stylesheet" href="./styles/overrides.css" />
</head>
<body class="va-studio-body">
  <header id="va-studio-bar" class="va-studio-bar">
    <div class="va-bar-left">
      <div class="va-studio-brand">
        <i class="fa-solid fa-layer-group va-brand-icon" aria-hidden="true"></i>
        <span class="va-brand-text">Quiet UI <span class="va-studio-badge">v9.0</span></span>
      </div>
      <div id="va-studio-mode-tablist" class="va-mode-tablist" role="tablist" aria-label="Studio Surface Mode">
        <button type="button" role="tab" id="va-tab-worlds" class="va-mode-tab is-active" data-studio-tab="worlds" aria-selected="true">Worlds</button>
        <button type="button" role="tab" id="va-tab-bench" class="va-mode-tab" data-studio-tab="bench" aria-selected="false">Bench</button>
        <button type="button" role="tab" id="va-tab-atlas" class="va-mode-tab" data-studio-tab="atlas" aria-selected="false">Atlas</button>
      </div>
      <label class="va-inline-ctrl va-world-ctrl va-fold-up" for="va-world-select">
        <span class="va-ctrl-prefix">World:</span>
        <select id="va-world-select" class="va-ctrl-bare-select" aria-label="Select Corpus World">
          <option value="01-clinical-icu-and-trials">01 · Clinical ICU &amp; Trials</option>
          <option value="02-cloud-cyber-and-ai-ops">02 · Cloud, Cyber &amp; AI Ops</option>
          <option value="03-industrial-grid-and-manufacturing">03 · Industrial Grid &amp; Quality</option>
          <option value="04-civic-finance-and-stem-learning">04 · Civic Finance &amp; STEM</option>
          <option value="05-physical-systems-auto-and-aero">05 · Auto, CAN-FD &amp; Aero HUD</option>
        </select>
      </label>
    </div>

    <div class="va-bar-center">
      <button type="button" id="va-step-prev" class="va-step-btn" aria-label="Previous Distilled View" title="Previous View"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></button>
      <select id="va-view-select" class="va-studio-select va-tier-select" aria-label="Select Distilled View">
        <option value="v01-icu-bedside-terminal">v01 · ICU Bedside Terminal (M4 · L3)</option>
        <option value="v02-trial-regulatory-brief">v02 · Trial Regulatory Brief (M2↔M1 · L3)</option>
        <option value="v03-patient-recovery-companion">v03 · Patient Recovery (M3 · L1)</option>
      </select>
      <button type="button" id="va-step-next" class="va-step-btn" aria-label="Next Distilled View" title="Next View"><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>
    </div>

    <div class="va-bar-right">
      <button type="button" id="va-theme-cycle-btn" class="va-studio-btn va-phone-only" aria-label="Cycle Surface Theme" title="Cycle Surface Theme"><i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i></button>

      <div class="va-theme-dots va-fold-up" role="radiogroup" aria-label="Surface Theme">
        <button type="button" class="va-theme-dot is-active" data-theme-dot="white" role="radio" aria-checked="true" aria-label="White Theme" title="White"></button>
        <button type="button" class="va-theme-dot" data-theme-dot="paper" role="radio" aria-checked="false" aria-label="Paper Theme" title="Paper"></button>
        <button type="button" class="va-theme-dot" data-theme-dot="dark-paper" role="radio" aria-checked="false" aria-label="Slate Theme" title="Slate"></button>
        <button type="button" class="va-theme-dot" data-theme-dot="dark" role="radio" aria-checked="false" aria-label="OLED Theme" title="OLED"></button>
      </div>

      <button type="button" id="va-sheet-toggle-btn" class="va-studio-btn" aria-pressed="false" title="Toggle M1 Paper Sheet Preview">
        <i class="fa-regular fa-file-lines" aria-hidden="true"></i><span class="va-btn-lbl">Sheet</span>
      </button>

      <button type="button" id="va-print-btn" class="va-studio-btn va-desktop-only" aria-label="Print or Export PDF" title="Print / PDF">
        <i class="fa-solid fa-print" aria-hidden="true"></i><span>Print</span>
      </button>

      <button type="button" id="va-bridge-btn" class="va-studio-btn" aria-label="Why This View?" title="Why This View? Quiet-Bridge Provenance">
        <i class="fa-solid fa-compass-drafting" aria-hidden="true"></i><span class="va-btn-lbl-short">Why?</span><span class="va-btn-lbl-wide">Why This View?</span>
      </button>

      <label class="va-inline-ctrl va-nav-ctrl va-fold-up" for="va-nav-select">
        <span class="va-ctrl-prefix">Nav:</span>
        <select id="va-nav-select" class="va-ctrl-bare-select" aria-label="Navigation Shell">
          <option value="auto" selected>Auto</option>
          <option value="n0">N0 None</option>
          <option value="n1">N1 Rail</option>
          <option value="n2">N2 Top</option>
          <option value="n3">N3 Dual</option>
          <option value="n4">N4 Dock</option>
        </select>
      </label>

      <label class="va-inline-ctrl va-desktop-only" for="va-vp-select">
        <span class="va-ctrl-prefix">Stage:</span>
        <select id="va-vp-select" class="va-ctrl-bare-select" aria-label="Stage Simulator">
          <option value="fill" selected>Fill</option>
          <option value="390x844">390×844</option>
          <option value="840x1050">840×1050 Fold</option>
          <option value="1920x1080">1080p</option>
          <option value="3840x2160">4K</option>
        </select>
      </label>

      <div id="va-stage-tools" class="va-stage-tools va-desktop-only" hidden>
        <button type="button" id="va-rotate-btn" class="va-studio-btn" aria-label="Rotate Stage" title="Rotate Viewport"><i class="fa-solid fa-rotate" aria-hidden="true"></i></button>
        <button type="button" id="va-zoom-btn" class="va-studio-btn" aria-label="Toggle Zoom Mode" title="Toggle Zoom Mode">FIT</button>
      </div>

      <button type="button" id="va-customize-btn" class="va-studio-btn va-gear-btn" aria-label="Studio Settings" title="Studio Settings">
        <i class="fa-solid fa-gear" aria-hidden="true"></i>
        <span id="va-settings-dot" class="va-settings-dot" hidden></span>
      </button>
    </div>
  </header>

  <main id="va-portal-mat">
    <div id="va-portal-scaler">
      <div class="va-hinge-guide"></div>
      <div class="va-drag-handle va-drag-w"></div>
      <div class="va-drag-handle va-drag-e"></div>
      <div class="va-drag-handle va-drag-s"></div>
      <iframe id="va-stage-portal" name="va-stage-portal" title="Quiet UI v9.0 Stage Portal"></iframe>
    </div>
  </main>

  <dialog id="va-customize-sheet" closedby="any" aria-labelledby="va-customize-title">
    <div class="va-customize-header">
      <strong id="va-customize-title">Studio Settings</strong>
      <button type="button" class="va-studio-btn" aria-label="Close Settings" onclick="this.closest('dialog').close()" autofocus><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
    </div>
    <div class="va-sheet-sections">
      <div class="va-customize-field va-worlds-only">
        <label class="va-customize-label" for="va-sheet-world-select">CORPUS WORLD</label>
        <select id="va-sheet-world-select" class="va-studio-select">
          <option value="01-clinical-icu-and-trials">01 · Clinical ICU &amp; Trials</option>
          <option value="02-cloud-cyber-and-ai-ops">02 · Cloud, Cyber &amp; AI Ops</option>

    min-block-size: 32px;
    padding: 0.35rem 0.75rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    flex-wrap: wrap;
    background: var(--bg-elevated);
    border-radius: var(--radius-inner);
    font-size: var(--ts-sm);
  }

  /* Control Primitives: Sleek >= 28-32px on Desktop/Foldable, >= 44px on Phone */
  button, .va-btn-primary, .va-btn-ghost, .va-pill-btn, select, input {
    min-block-size: 26px;
  }

  .va-btn-primary,
  .va-btn-ghost {
    min-block-size: 32px;
    padding: 0.35rem 0.85rem;
    font-family: var(--font-sans);
    font-size: var(--ts-sm);
    border-radius: var(--radius-sm);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    text-decoration: none;
  }

  .va-btn-primary {
    font-weight: 600;
    border: 1px solid transparent;
    background: var(--accent-primary);
    color: #FFFFFF;
  }

  .va-btn-ghost {
    font-weight: 500;
    border: 1px solid var(--border-strong);
    background: transparent;
    color: var(--text-primary);
  }

  .va-pill-btn {
    min-block-size: 28px;
    padding: 0.22rem 0.62rem;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    background: var(--bg-elevated);
    color: var(--text-secondary);
    font-family: var(--font-sans);
    font-size: var(--ts-xs);
    font-weight: 600;
    line-height: 1.2;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    cursor: pointer;
    white-space: nowrap;
  }

  .va-pill-btn:hover {
    border-color: var(--accent-primary);
    color: var(--text-primary);
  }

  .va-pill-btn.active,
  .va-pill-btn.is-active {
    background: var(--accent-primary);
    border-color: var(--accent-primary);
    color: #FFFFFF;
  }

  .va-figure-hdr .va-pill-btn {
    min-block-size: 26px;
    padding: 0.15rem 0.5rem;
    font-size: max(0.75rem, 11px);
  }

  /* Sidebar & Tree Link Primitives */
  .va-side-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    padding: 0.38rem 0.6rem;
    border-radius: var(--radius-sm);
    color: var(--text-secondary);
    font-family: var(--font-sans);
    font-size: var(--ts-xs);
    font-weight: 500;
    text-decoration: none;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .va-side-link:hover,
  .va-side-link.active,
  .va-side-link.is-active {
    background: var(--bg-elevated);
    color: var(--accent-primary);
    font-weight: 600;
  }
  .va-side-link-left {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    min-inline-size: 0;
  }

  pre {
    overflow-x: auto;
    max-inline-size: 100%;
    margin: 0;
  }

  /* Badges & Status */
  .va-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    font-size: var(--ts-xs);
    font-weight: 600;
    padding: 0.15rem 0.5rem;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-hairline);
    background: var(--bg-elevated);
    color: var(--text-secondary);
    line-height: 1.2;
    white-space: nowrap;
  }
  .va-badge-ok      { background: var(--status-ok-bg); color: var(--status-ok); border-color: var(--status-ok); }
  .va-badge-warn    { background: var(--status-warn-bg); color: var(--status-warn); border-color: var(--status-warn); }
  .va-badge-err     { background: var(--status-err-bg); color: var(--status-err); border-color: var(--status-err); }
  .va-badge-neutral { background: var(--bg-elevated); color: var(--text-secondary); border-color: var(--border-hairline); }

  .va-stale-badge {
    background: var(--status-warn-bg);
    color: var(--status-warn);
    border: 1px solid var(--status-warn);
    border-radius: var(--radius-sm);
    padding: 0.15rem 0.45rem;
    font-size: var(--ts-xs);
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
  }

  /* Prose Rhythm & Ceiling */
  .va-prose {
    font-size: var(--ts-prose);
    line-height: 1.65;
    color: var(--text-primary);
    min-inline-size: 0;
  }
  .va-prose h1 { line-height: 1.15; text-wrap: balance; margin: 0.25rem 0 0.5rem; font-size: var(--ts-xl); }
  .va-prose h2 { margin-block: 1.65rem 0.55rem; font-size: var(--ts-md); line-height: 1.28; }
  .va-prose h3 { margin-block: 1.15rem 0.4rem; font-size: var(--ts-base); }
  .va-prose p, .va-prose li { max-inline-size: 68ch; margin-block: 0 0.85rem; }

  /* Figures & SVG Schematics */
  .va-figure-card {
    margin: 1.1rem 0;
    background: var(--bg-surface);
    border: 1px solid var(--border-hairline);
    border-radius: var(--radius-card);
    padding: var(--density-card-pad);
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    min-inline-size: 0;
  }

  .va-figure-hdr {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    flex-wrap: wrap;
    font-size: var(--ts-sm);
  }

  .va-figure-caption {
    font-family: var(--font-sans);
    font-size: var(--ts-xs);
    color: var(--text-muted);
    line-height: 1.45;
    padding-top: 0.35rem;
    border-top: 1px solid var(--border-hairline);
  }

  .va-figure-scroll {
    overflow-x: auto;
    max-inline-size: 100%;
    min-inline-size: 0;
    -webkit-overflow-scrolling: touch;
  }

  .va-figure-scroll svg.va-schematic-svg {
    display: block;
    inline-size: 100%;
    min-inline-size: 540px;
    max-inline-size: 760px;
    block-size: auto;
    margin-inline: auto;
  }

  .va-mermaid-code {
    font-family: var(--font-mono);
    font-size: var(--ts-xs);
    overflow-x: auto;
    padding: 0.75rem;
    background: var(--bg-elevated);
    border-radius: var(--radius-inner);
    border: 1px solid var(--border-hairline);
    white-space: pre;
  }

  /* Responsive Data & Academic Booktabs Tables */
  .va-table-wrap {
    overflow-x: auto;
    max-inline-size: 100%;
    min-inline-size: 0;
    border: 1px solid var(--border-hairline);
    border-radius: var(--radius-card);
    background: var(--bg-surface);
  }

  table.va-data-table,
  table.booktabs {
    inline-size: 100%;
    border-collapse: collapse;
    font-size: var(--ts-xs);
    font-variant-numeric: var(--font-nums);
  }

  table.booktabs {
    border-top: 2px solid var(--border-strong);
    border-bottom: 2px solid var(--border-strong);
  }

  table.va-data-table th,
  table.va-data-table td,
  table.booktabs th,
  table.booktabs td {
    min-inline-size: 54px;
    padding: 0.42rem 0.55rem;
    text-align: left;
    border-bottom: 1px solid var(--border-hairline);
    overflow-wrap: normal;
    word-break: normal;
    vertical-align: middle;
  }

  table.va-data-table th,
  table.booktabs th {
    background: var(--bg-elevated);
    font-family: var(--font-sans);
    font-weight: 700;
    color: var(--text-muted);
    font-size: var(--ts-xs);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    white-space: nowrap;
    border-bottom: 1.5px solid var(--border-strong);
  }

  table.va-data-table td { white-space: nowrap; }
  table.booktabs td { white-space: normal; }
  table.booktabs td strong,
  table.booktabs td code { white-space: nowrap; }
}

@layer utilities {
  .mono { font-family: var(--font-mono); font-variant-numeric: var(--font-nums); }
  .tabular-nums { font-variant-numeric: var(--font-nums); }
  th.num, td.num, .num {
    text-align: right;
    font-family: var(--font-mono);
    font-variant-numeric: var(--font-nums);
    white-space: nowrap;
  }

  .math-bar { text-decoration: overline; }

  .va-bleed-wide { inline-size: 100%; max-inline-size: 100%; min-inline-size: 0; }

  .sq-status {
    display: inline-block;
    inline-size: 8px;
    block-size: 8px;
    border-radius: 2px;
    margin-right: 0.35rem;
    vertical-align: middle;
    background: var(--text-muted);
  }
  .sq-ok   { background: var(--status-ok); }
  .sq-warn { background: var(--status-warn); }
  .sq-err  { background: var(--status-err); }

  /* Phone Portrait (<480px / data-form-factor="touch") >= 44px Hit Targets */
  [data-form-factor="touch"] :is(button, .va-btn-primary, .va-btn-ghost, .va-pill-btn, .ann-ack-btn, select, input:not([type="checkbox"]):not([type="radio"]):not([type="range"])) {
    min-block-size: 44px;
  }

  @media (max-width: 480px) {
    button, .va-btn-primary, .va-btn-ghost, .va-pill-btn, .ann-ack-btn, select,
    input:not([type="checkbox"]):not([type="radio"]):not([type="range"]) {
      min-block-size: 44px;
    }
  }
}

@layer shell {

  .va-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    block-size: 1.125rem;
    line-height: 1;
    box-sizing: border-box;
    vertical-align: middle;
    padding-inline: 0.42rem;
    border-radius: var(--radius-xs, 2px);
    border: 1px solid transparent;
    font-family: var(--font-mono);
    font-size: 0.6875rem;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    text-box: trim-both cap alphabetic;

  /* Variant 1: ISA-101 / NUREG-0700 Status Annunciator */
  .va-pill[data-variant="status"][data-state="nominal"] {
    background: transparent;
    border-width: 0;
    padding-inline: 0;
    color: var(--text-secondary);

    color: var(--status-warn);

  .va-pill[data-variant="status"][data-state="fault"]::before {

    <article id="v05-rationale" class="v9-prose-card">
      <h2>Enclave Perimeter Segregation &amp; Cryptographic Interlocks</h2>
      <p>Every cross-enclave link traverses an explicit Ports, Protocols, and Services Management (PPSM) boundary (4 cross-enclave edges across 3 non-overlapping enclaves). Edge API PEP terminates client TLS 1.3 and queries PDP policy before issuing short-lived SPIFFE identities to the compute mesh.</p>
      <p>Cryptographic enforcement is hardware-latched in register CSR_MTLS_POLICY at offset 0x0010 (value 0x8003B104). Safety-critical bit [31] (FIPS_STRICT = 1) rejects non-FIPS ciphers at the policy enforcement point, while bit [30] (LEGACY_TLS_ALLOW = 0) and bit [14] (CRL_FAIL_OPEN = 0) prevent downgrade or fail-open bypass.</p>
    </article>

    <article id="v09-methods" class="v9-prose-card">
      <h2>Subgroup Metrology, Control Boundaries &amp; Safety Interlock Proof</h2>
      <p>Twelve coordinate-measuring machine (CMM) subgroups of n = 5 bearing bores remain squarely inside the ±3 sigma statistical control band (CL = 10.000 mm, UCL = 10.042 mm, LCL = 9.958 mm) and wide of engineering tolerance limits (LSL 9.930 mm to USL 10.070 mm), sustaining C<sub>pk</sub> = 1.64 without spline smoothing.</p>
      <p>Machine cell safety ties to Holding Register 0x0104 (0x0A15). Safety-critical latch bits verify that LOTO Lockout bit [10] and E-Stop bit [8] are clear (0) while Synchrocheck bit [9] and Breaker 52-M Auxiliary bit [0] stay asserted (1).</p>

    const w = parseInt(m[1], 10);
    const h = parseInt(m[2], 10);

  }

    }

    const availH = Math.max(100, matEl.clientHeight - 28);
    const scale = Math.min(1, availW / width, availH / height);
    return {
      scale: scale,
      scalerW: Math.round(width * scale),
      scalerH: Math.round(height * scale),
    };
  }

  function isFoldableSize(w, h) {
    return (
      (w === 840 && h === 1050) || (w === 1050 && h === 840) ||
      (w === 820 && h === 1180) || (w === 1180 && h === 820)

      scalerEl.style.height = '100%';
      scalerEl.classList.remove('has-hinge');
      portalEl.style.width = '100%';
      portalEl.style.height = '100%';
      portalEl.style.transform = 'none';
      return;
    }
    const fit = computeScale(dims.width, dims.height, matEl, zoomMode);
    scalerEl.classList.toggle('has-hinge', isFoldableSize(dims.width, dims.height));
    scalerEl.style.width = fit.scalerW + 'px';
    scalerEl.style.height = fit.scalerH + 'px';
    portalEl.style.width = dims.width + 'px';
    portalEl.style.height = dims.height + 'px';
    portalEl.style.transform = 'scale(' + fit.scale + ')';
    portalEl.style.transformOrigin = 'top left';

    if (!scalerEl) return;

      hasMoved = false;

      document.addEventListener('mousemove', onMouseMove);
      document.addEventListener('mouseup', onMouseUp);
      document.body.style.userSelect = 'none';

      if (!isDragging) return;
      hasMoved = true;
      let newW = startW;

      if (dragDir === 'e') newW = Math.max(320, startW + (e.clientX - startX) * 2);
      else if (dragDir === 'w') newW = Math.max(320, startW - (e.clientX - startX) * 2);

    if (sheetBtn) {
      const isSheet = state.medium === 'm1';
      sheetBtn.classList.toggle('is-active', isSheet);
      sheetBtn.setAttribute('aria-pressed', isSheet ? 'true' : 'false');
    }

    const navSel = document.getElementById('va-nav-select');
    const allowed = viewMeta ? viewMeta.allowed_navs : ['n0', 'n1', 'n2', 'n3', 'n4'];
    if (navSel) {
      navSel.value = state.nav;
      Array.from(navSel.options).forEach(function (opt) {
        if (opt.value === 'auto') return;
        opt.disabled = allowed.indexOf(opt.value) === -1;
      });
    }

    const vpSel = document.getElementById('va-vp-select');
    if (vpSel) vpSel.value = state.vp;
    const stageTools = document.getElementById('va-stage-tools');
    if (stageTools) stageTools.hidden = state.vp === 'fill';
    const zoomBtn = document.getElementById('va-zoom-btn');
    if (zoomBtn) zoomBtn.textContent = state.zoom.toUpperCase();

    if (window.QuietStudioSheetV9) window.QuietStudioSheetV9.syncSheetControls(state, allowed);
  }

  function syncExternalMode(iframe) {
    const isBench = state.studioView === 'bench';
    const base = resolveDocsAsset(isBench ? 'bench/evidence-bench.html' : 'diagrams.html');
    const med = state.medium === 'm1' ? 'm1' : 'm2';
    const q = '?embed=1&theme=' + encodeURIComponent(state.theme) + '&density=' + encodeURIComponent(state.density) + '&corners=' + encodeURIComponent(state.corners) + (isBench ? '&medium=' + med : '');
    const doSync = function () {
      const d = getActiveDimensions();
      if (window.QuietStudioSheetV9) window.QuietStudioSheetV9.postExternalSync(iframe, state, d ? d.width : (iframe.clientWidth || window.innerWidth));
    };
    if (iframe.dataset.externalMode !== state.studioView) {
      state.isMounted = false;
      state.renderedView = '';
      iframe.removeAttribute('srcdoc');
      iframe.dataset.externalMode = state.studioView;
      iframe.onload = function () { state.isMounted = true; doSync(); };
      iframe.src = base + q;
      return;
    }
    doSync();
  }

  function applyState(worldChanged) {
    const worldObj = findWorld(state.world);
    if (worldObj && (worldChanged || !findView(worldObj, state.view))) {
      state.view = worldObj.views[0].view_id;
    }
    const viewKey = state.studioView + ':' + state.view + ':' + state.medium;
    if (state.lastViewKey !== viewKey && window.QuietStudioSheetV9) {
      window.QuietStudioSheetV9.untuckStudioBar();
    }
    state.lastViewKey = viewKey;
    const viewMeta = findView(worldObj, state.view);
    const iframe = document.getElementById('va-stage-portal');
    if (!iframe) return;
    updatePortalDimensions();
    if (state.studioView !== 'worlds') {
      syncExternalMode(iframe);
      syncBarControls();
      syncUrlParams();
      return;
    }
    if (!viewMeta) return;
    if (iframe.dataset.externalMode) {
      delete iframe.dataset.externalMode;
      iframe.removeAttribute('src');
      state.isMounted = false;
    }
    if (!state.isMounted || !iframe.contentDocument || !iframe.contentDocument.getElementById('va-stage-main')) {
      state.renderedView = '';
      iframe.onload = function () { state.isMounted = true; updatePortalDimensions(); syncIframeDOM(); };
      iframe.srcdoc = buildIframeSrcDoc(viewMeta);
    } else {
      syncIframeDOM();
    }
    syncBarControls();
    syncUrlParams();
  }

  function openBridgeDialog() {
    const worldObj = findWorld(state.world);
    const viewMeta = findView(worldObj, state.view);
    if (window.QuietStudioSheetV9) window.QuietStudioSheetV9.openBridgeDialog(worldObj, viewMeta);
  }

  function printActiveStage() {
    const iframe = document.getElementById('va-stage-portal');
    if (iframe && iframe.contentWindow) {
      iframe.contentWindow.focus();
      iframe.contentWindow.print();
    }
  }

  function stepView(delta) {
    const worldObj = findWorld(state.world);
    if (!worldObj || !worldObj.views.length) return;
    const list = worldObj.views;
    let idx = list.findIndex(function (v) { return v.view_id === state.view; });
    idx = (idx + delta + list.length) % list.length;
    state.view = list[idx].view_id;
    if (window.QuietStudioSheetV9) window.QuietStudioSheetV9.untuckStudioBar();
    applyState(false);
  }

  function initControls() {
    const bind = function (id, fn) { const el = document.getElementById(id); if (el) el.addEventListener('click', fn); };
    const tablist = document.getElementById('va-studio-mode-tablist');
    if (tablist) {
      tablist.addEventListener('click', function (ev) {
        const btn = ev.target && ev.target.closest ? ev.target.closest('[data-studio-tab]') : null;
        if (btn && ['worlds', 'bench', 'atlas'].indexOf(btn.dataset.studioTab) !== -1) {
          state.studioView = btn.dataset.studioTab;
          applyState(false);
        }
      });
    }
    const wSel = document.getElementById('va-world-select');
    if (wSel) wSel.addEventListener('change', function (e) { state.world = e.target.value; applyState(true); });
    const vSel = document.getElementById('va-view-select');
    if (vSel) vSel.addEventListener('change', function (e) { state.view = e.target.value; applyState(false); });
    ['vp', 'density', 'corners', 'nav'].forEach(function (k) {
      const el = document.getElementById('va-' + k + '-select');
      if (el) el.addEventListener('change', function (e) { state[k] = e.target.value; applyState(false); });
    });
    const onRotate = function () { const d = getActiveDimensions(); if (d) { state.vp = d.height + 'x' + d.width; applyState(false); } };
    const onZoomToggle = function () { state.zoom = (state.zoom === 'fit') ? '1:1' : 'fit'; updatePortalDimensions(); syncBarControls(); syncUrlParams(); };
    [
      ['va-step-prev', function () { stepView(-1); }], ['va-step-next', function () { stepView(1); }],
      ['va-sheet-toggle-btn', function () { state.medium = (state.medium === 'm1') ? 'auto' : 'm1'; applyState(false); }],
      ['va-print-btn', printActiveStage], ['va-bridge-btn', openBridgeDialog],
      ['va-rotate-btn', onRotate], ['va-zoom-btn', onZoomToggle],
      ['va-customize-btn', function () { const s = document.getElementById('va-customize-sheet'); if (s && s.showModal) s.showModal(); }],
    ].forEach(function (pair) { bind(pair[0], pair[1]); });
    if (window.QuietStudioSheetV9) window.QuietStudioSheetV9.initSheetEvents(state, applyState, onRotate, onZoomToggle, printActiveStage);
    window.addEventListener('resize', function () {
      if (window.innerWidth >= 700 && window.QuietStudioSheetV9) window.QuietStudioSheetV9.untuckStudioBar();
      updatePortalDimensions();
      if (state.studioView === 'worlds') syncIframeDOM();
    });
    window.QuietPortalResize.initResizeHandles(
      document.getElementById('va-portal-scaler'), document.getElementById('va-stage-portal'), document.getElementById('va-portal-mat'),
      function (w, h) { state.vp = w + 'x' + h; if (state.studioView === 'worlds') syncIframeDOM(); syncUrlParams(); syncBarControls(); }
    );
  }

  window.addEventListener('DOMContentLoaded', function () {
    loadManifest();
    readUrlParams();
    initControls();
    applyState(false);
  });
  window.QuietStudioPortalV9 = { state: state, applyState: applyState, openBridgeDialog: openBridgeDialog };
})(window, document);

  </script>
</body>
</html>
