<!DOCTYPE html>
<html lang="en" class="va-studio-root" data-medium="auto" data-studio-view="examples">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiet UI v9.0 — Interactive Studio</title>
  <style id="va-studio-chrome-css">
/* SPDX-License-Identifier: Apache-2.0 */
/* Quiet UI v9.0 — Studio Portal Bar, Mat, Scaler & Quiet-Bridge Provenance Dialog */

html.va-studio-root,
body.va-studio-body {
  margin: 0;
  padding: 0;
  block-size: 100dvh;
  inline-size: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #070B12;
  color: #F8FAFC;
  font-size: 13px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
}

*, *::before, *::after { box-sizing: border-box; }
summary { list-style: none; }
summary::-webkit-details-marker { display: none; }

#va-studio-bar,
.va-studio-bar {
  block-size: 44px;
  min-block-size: 44px;
  max-block-size: 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: nowrap;
  gap: 0.35rem;
  padding: 0 0.5rem;
  background: #0F172A;
  border-bottom: 1px solid #1E293B;
  z-index: 100;
  flex-shrink: 0;
  overflow: hidden;
  transition: margin-top 0.18s ease, transform 0.18s ease;
}

#va-studio-bar.is-tucked {
  margin-top: -44px;
  transform: translateY(-100%);
}

.va-bar-left,
.va-bar-right {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  flex: 0 0 auto;
  min-inline-size: 0;
}

.va-bar-center {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.28rem;
  flex: 1 1 auto;
  min-inline-size: 0;
}

.va-studio-brand {
  font-weight: 700;
  font-size: 12.5px;
  color: #F8FAFC;
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  white-space: nowrap;
}
.va-brand-icon { inline-size: 16px; block-size: 16px; color: #38BDF8; flex-shrink: 0; }
.va-brand-text { display: inline-flex; align-items: center; gap: 0.3rem; }
.va-studio-badge {
  font-size: 11px;
  font-weight: 600;
  background: #1E293B;
  color: #38BDF8;
  padding: 1px 5px;
  border-radius: 4px;
  border: 1px solid #334155;
}

.va-step-btn {
  min-block-size: 30px;
  inline-size: 26px;
  padding: 0;
  border: 1px solid #334155;
  border-radius: 6px;
  background: #1E293B;
  color: #CBD5E1;
  font-size: 11px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
}
.va-step-btn:hover { background: #334155; color: #FFFFFF; }

.va-studio-select,
.va-studio-btn {
  min-block-size: 30px;
  padding: 0.15rem 0.5rem;
  border: 1px solid #334155;
  border-radius: 6px;
  background: #1E293B;
  color: #F1F5F9;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.3rem;
  white-space: nowrap;
  font-family: inherit;
}
.va-tier-select {
  inline-size: 100%;
  min-inline-size: 0;
  max-inline-size: 320px;
  flex: 1 1 auto;
  overflow: hidden;
  text-overflow: ellipsis;
}
.va-studio-select:hover,
.va-studio-btn:hover { background: #334155; }
.va-studio-btn.is-active,
.va-studio-btn[aria-pressed="true"] {
  background: #2563EB;
  border-color: #60A5FA;
  color: #FFFFFF;
}

.va-inline-ctrl {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  min-block-size: 30px;
  padding: 0 0.42rem;
  border: 1px solid #334155;
  border-radius: 6px;
  background: #1E293B;
  color: #CBD5E1;
  font-size: 11.5px;
  white-space: nowrap;
}
.va-domain-ctrl { max-inline-size: 230px; flex: 0 1 auto; }
.va-domain-ctrl .va-ctrl-bare-select { max-inline-size: 162px; overflow: hidden; text-overflow: ellipsis; }
.va-ctrl-prefix { color: #94A3B8; font-weight: 600; font-size: 11px; }
.va-ctrl-bare-select {
  border: 0;
  background: transparent;
  color: #F8FAFC;
  font-size: 12px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  outline: none;
  padding-right: 0.12rem;
}
.va-ctrl-bare-select option { background: #0F172A; color: #F8FAFC; }

.va-gear-btn { position: relative; min-inline-size: 30px; padding: 0 0.45rem; }
.va-settings-dot {
  position: absolute;
  top: 4px;
  right: 4px;
  inline-size: 6px;
  block-size: 6px;
  border-radius: 999px;
  background: #38BDF8;
}
.va-settings-dot[hidden] { display: none; }

@media (max-width: 699px) {
  .va-studio-brand, .va-fold-up { display: none; }
}
@media (min-width: 700px) and (max-width: 1099px) {
  .va-brand-text { display: none; }
  .va-domain-ctrl { max-inline-size: 185px; }
  .va-domain-ctrl .va-ctrl-bare-select { max-inline-size: 122px; }
  .va-tier-select { min-inline-size: 13rem; }
}

.va-mode-tablist {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 2px;
  background: #070B12;
  border: 1px solid #1E293B;
  border-radius: 7px;
}
.va-mode-tab {
  min-block-size: 26px;
  padding: 0 0.55rem;
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: #94A3B8;
  font: 600 11.5px/1 inherit;
  cursor: pointer;
  white-space: nowrap;
}
.va-mode-tab:hover { color: #F8FAFC; }
.va-mode-tab[aria-selected="true"],
.va-mode-tab.is-active {
  background: #1E293B;
  color: #38BDF8;
}
html[data-studio-view="components"] :is(.va-domain-ctrl, .va-bar-center, #va-bridge-btn, .va-examples-only) {
  display: none;
}
@media (max-width: 699px) {
  .va-mode-tab { padding: 0 0.4rem; font-size: 11px; }
}
@media (max-width: 519px) {
  #va-studio-bar, .va-studio-bar { padding: 0 0.3rem; gap: 0.2rem; }
  .va-bar-left, .va-bar-right { gap: 0.2rem; }
  .va-mode-tab { padding: 0 0.35rem; font-size: 10.5px; }
  .va-step-btn { inline-size: 22px; }
  .va-studio-btn { padding: 0.15rem 0.38rem; }
}

#va-portal-mat {
  flex: 1;
  min-block-size: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  background: #070B12;
  user-select: none;
}

#va-portal-scaler {
  position: relative;
  box-shadow: 0 20px 48px rgba(0, 0, 0, 0.55);
  transition: width 0.12s ease-out, height 0.12s ease-out;
  background: #090D16;
}

#va-stage-portal {
  border: none;
  background: #090D16;
  display: block;
}

.va-hinge-guide {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  width: 2px;
  transform: translateX(-50%);
  border-left: 2px dashed rgba(56, 189, 248, 0.65);
  pointer-events: none;
  z-index: 25;
  display: none;
}
#va-portal-scaler.has-hinge .va-hinge-guide { display: block; }

.va-drag-handle { position: absolute; z-index: 30; }
.va-drag-w { left: -6px; top: 0; bottom: 0; width: 12px; cursor: ew-resize; }
.va-drag-e { right: -6px; top: 0; bottom: 0; width: 12px; cursor: ew-resize; }
.va-drag-s { bottom: -6px; left: 0; right: 0; height: 12px; cursor: ns-resize; }

dialog#va-customize-sheet,
dialog#va-bridge-dialog {
  border: 1px solid #334155;
  background: #0F172A;
  color: #F8FAFC;
  padding: 0.95rem 1.05rem;
  box-shadow: 0 24px 56px rgba(0, 0, 0, 0.62);
  border-radius: 10px;
  overflow-y: auto;
}
dialog#va-customize-sheet:modal,
dialog#va-bridge-dialog:modal { overscroll-behavior: contain; }
dialog#va-customize-sheet::backdrop,
dialog#va-bridge-dialog::backdrop {
  background: rgba(7, 11, 18, 0.62);
  backdrop-filter: blur(3px);
  overflow: hidden;
  overscroll-behavior: contain;
}
dialog#va-customize-sheet {
  margin: 50px 0.65rem auto auto;
  inline-size: 372px;
  max-inline-size: calc(100vw - 1.3rem);
  max-block-size: calc(100dvh - 64px);
}
dialog#va-bridge-dialog {
  margin: auto;
  inline-size: min(92vw, 820px);
  max-block-size: calc(100dvh - 48px);
}
@media (max-width: 699px) {
  dialog#va-customize-sheet {
    margin: auto 0 0 0;
    inline-size: 100%;
    max-inline-size: 100%;
    max-block-size: 84dvh;
    border-radius: 14px 14px 0 0;
    border-bottom: 0;
  }
}

.va-customize-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 0.75rem;
  margin-bottom: 0.75rem;
  padding-bottom: 0.5rem;
  border-bottom: 1px solid #1E293B;
  font-size: 13px;
}
.va-bridge-hdr-copy { display: flex; flex-direction: column; gap: 0.15rem; }
.va-bridge-hdr-copy strong { font-size: 15px; color: #F8FAFC; }
.va-sheet-sections,
.va-bridge-body { display: flex; flex-direction: column; gap: 0.75rem; }
.va-customize-field { display: flex; flex-direction: column; gap: 0.3rem; }
.va-customize-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
.va-customize-label { font-size: 11px; font-weight: 700; color: #94A3B8; text-transform: uppercase; letter-spacing: 0.05em; }
.va-theme-cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.4rem; }
@media (max-width: 480px) {
  .va-theme-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
.va-theme-card {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 0.28rem;
  padding: 0.35rem;
  border: 1.5px solid #334155;
  border-radius: 7px;
  background: #111B2E;
  color: #E2E8F0;
  font: 600 11px/1.2 inherit;
  cursor: pointer;
  text-align: left;
}
.va-theme-card:hover { border-color: #64748B; }
.va-theme-card.is-active {
  border-color: #38BDF8;
  box-shadow: 0 0 0 1px #38BDF8;
  color: #FFFFFF;
}
.va-theme-swatch {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  block-size: 30px;
  border-radius: 4px;
  padding: 5px;
  border: 1px solid rgba(148, 163, 184, 0.35);
}
.va-swatch-bar { display: block; inline-size: 62%; block-size: 4px; border-radius: 2px; }
.va-swatch-accent { display: block; inline-size: 38%; block-size: 4px; border-radius: 2px; }
.va-theme-card[data-sheet-theme="white"] .va-theme-swatch { background: #FFFFFF; }
.va-theme-card[data-sheet-theme="white"] .va-swatch-bar { background: #0F172A; }
.va-theme-card[data-sheet-theme="white"] .va-swatch-accent { background: #2563EB; }
.va-theme-card[data-sheet-theme="paper"] .va-theme-swatch { background: #F6F4EF; }
.va-theme-card[data-sheet-theme="paper"] .va-swatch-bar { background: #2B241E; }
.va-theme-card[data-sheet-theme="paper"] .va-swatch-accent { background: #B45309; }
.va-theme-card[data-sheet-theme="dark-paper"] .va-theme-swatch { background: #141312; }
.va-theme-card[data-sheet-theme="dark-paper"] .va-swatch-bar { background: #EAE4DA; }
.va-theme-card[data-sheet-theme="dark-paper"] .va-swatch-accent { background: #F59E0B; }
.va-theme-card[data-sheet-theme="dark"] .va-theme-swatch { background: #090D16; }
.va-theme-card[data-sheet-theme="dark"] .va-swatch-bar { background: #F8FAFC; }
.va-theme-card[data-sheet-theme="dark"] .va-swatch-accent { background: #38BDF8; }
.va-sheet-seg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.3rem; }
.va-sheet-seg-btn {
  min-block-size: 32px;
  padding: 0.2rem 0.35rem;
  border: 1px solid #334155;
  border-radius: 6px;
  background: #1E293B;
  color: #CBD5E1;
  font-size: 11.5px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
}
.va-sheet-seg-btn.is-active { background: #2563EB; border-color: #3B82F6; color: #FFFFFF; }
.va-sheet-stage-row,
.va-prompt-row { display: flex; align-items: center; gap: 0.35rem; }
.va-sheet-stage-row .va-studio-select { flex: 1 1 auto; }
.va-prompt-preview {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  color: #94A3B8;
  background: #070B12;
  border: 1px solid #1E293B;
  border-radius: 5px;
  padding: 0.35rem 0.5rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1 1 auto;
}

.va-bridge-card {
  background: #0B1220;
  border: 1px solid #1E293B;
  border-radius: 8px;
  padding: 0.7rem 0.85rem;
  display: flex;
  flex-direction: column;
  gap: 0.45rem;
}
.va-bridge-card h3 { margin: 0; font-size: 12px; font-weight: 700; color: #38BDF8; text-transform: uppercase; letter-spacing: 0.04em; }
.va-bridge-vector { font-size: 13px; color: #F8FAFC; font-weight: 600; }
.va-bridge-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 0.5rem; }
.va-bridge-item { background: #111B2E; border: 1px solid #1E293B; border-radius: 6px; padding: 0.5rem 0.6rem; font-size: 12px; color: #CBD5E1; }
.va-bridge-item strong { display: block; font-size: 11px; color: #94A3B8; margin-bottom: 0.18rem; text-transform: uppercase; }
.va-bridge-table-wrap { overflow-x: auto; border: 1px solid #1E293B; border-radius: 6px; }
.va-bridge-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
.va-bridge-table th,
.va-bridge-table td { padding: 0.38rem 0.55rem; text-align: left; border-bottom: 1px solid #1E293B; color: #CBD5E1; vertical-align: top; }
.va-bridge-table th { background: #111B2E; color: #94A3B8; font-weight: 700; font-size: 11px; text-transform: uppercase; }
.va-bridge-pass { color: #CBD5E1; font-family: ui-monospace, monospace; font-weight: 600; }

@media print {
  #va-studio-bar, dialog#va-customize-sheet, dialog#va-bridge-dialog, .va-hinge-guide, .va-drag-handle { display: none; }
}

  </style>
</head>
<body class="va-studio-body">
  <header id="va-studio-bar" class="va-studio-bar">
    <div class="va-bar-left">
      <div class="va-studio-brand">
        <svg class="va-brand-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.5 14 4.8 8 8 2 4.8 8 1.5Z" fill="none"/><path d="M2 8l6 3.2L14 8" fill="none"/><path d="M2 11.2 8 14.5l6-3.3" fill="none"/></svg>
        <span class="va-brand-text">Quiet UI <span class="va-studio-badge">v9.0</span></span>
      </div>
      <div id="va-studio-mode-tablist" class="va-mode-tablist" role="tablist" aria-label="Studio Mode">
        <button type="button" role="tab" id="va-tab-examples" class="va-mode-tab is-active" data-studio-tab="examples" aria-selected="true">Examples</button>
        <button type="button" role="tab" id="va-tab-components" class="va-mode-tab" data-studio-tab="components" aria-selected="false">Components</button>
      </div>
      <label class="va-inline-ctrl va-domain-ctrl va-fold-up" for="va-domain-select">
        <span class="va-ctrl-prefix">Domain:</span>
        <select id="va-domain-select" class="va-ctrl-bare-select" aria-label="Select Domain">
          <option value="01-clinical-icu-and-trials">01 · Clinical &amp; Trials</option>
          <option value="02-cloud-cyber-and-ai-ops">02 · Cloud, Security &amp; AI</option>
          <option value="03-industrial-grid-and-manufacturing">03 · Grid &amp; Manufacturing</option>
          <option value="04-civic-finance-and-stem-learning">04 · Finance &amp; STEM Lab</option>
          <option value="05-physical-systems-auto-and-aero">05 · Auto &amp; Aerospace</option>
        </select>
      </label>
    </div>

    <div class="va-bar-center">
      <button type="button" id="va-step-prev" class="va-step-btn" aria-label="Previous View" title="Previous View"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3.5 5.5 8 10 12.5" fill="none"/></svg></button>
      <select id="va-view-select" class="va-studio-select va-tier-select" aria-label="Select Example View">
        <option value="v01-icu-bedside-terminal">v01 · ICU Bedside Terminal</option>
        <option value="v02-trial-regulatory-brief">v02 · Trial Regulatory Brief</option>
        <option value="v03-patient-recovery-companion">v03 · Patient Recovery Guide</option>
      </select>
      <button type="button" id="va-step-next" class="va-step-btn" aria-label="Next View" title="Next View"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" fill="none"/></svg></button>
    </div>

    <div class="va-bar-right">
      <button type="button" id="va-bridge-btn" class="va-studio-btn" aria-label="Design Rationale" title="Design Rationale and Quality Checks">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 7.5v4" fill="none"/><circle cx="8" cy="4.8" r="0.7" fill="currentColor"/></svg><span>Why?</span>
      </button>

      <button type="button" id="va-customize-btn" class="va-studio-btn va-gear-btn" aria-label="Settings" title="Appearance &amp; Display Settings">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="2.4"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M12.6 3.4l-1.1 1.1M4.5 11.5l-1.1 1.1" fill="none"/></svg>
        <span id="va-settings-dot" class="va-settings-dot" hidden></span>
      </button>
    </div>
  </header>

  <main id="va-portal-mat">
    <div id="va-portal-scaler">
      <div class="va-hinge-guide"></div>
      <div class="va-drag-handle va-drag-w"></div>
      <div class="va-drag-handle va-drag-e"></div>
      <div class="va-drag-handle va-drag-s"></div>
      <iframe id="va-stage-portal" name="va-stage-portal" title="Quiet UI v9.0 Preview Stage"></iframe>
    </div>
  </main>

  <dialog id="va-customize-sheet" closedby="any" aria-labelledby="va-customize-title">
    <div class="va-customize-header">
      <strong id="va-customize-title">Settings</strong>
      <button type="button" class="va-studio-btn" aria-label="Close Settings" onclick="this.closest('dialog').close()" autofocus><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none"/></svg></button>
    </div>
    <div class="va-sheet-sections">
      <div class="va-customize-field va-examples-only">
        <label class="va-customize-label" for="va-sheet-domain-select">DOMAIN</label>
        <select id="va-sheet-domain-select" class="va-studio-select">
          <option value="01-clinical-icu-and-trials">01 · Clinical &amp; Trials</option>
          <option value="02-cloud-cyber-and-ai-ops">02 · Cloud, Security &amp; AI</option>
          <option value="03-industrial-grid-and-manufacturing">03 · Grid &amp; Manufacturing</option>
          <option value="04-civic-finance-and-stem-learning">04 · Finance &amp; STEM Lab</option>
          <option value="05-physical-systems-auto-and-aero">05 · Auto &amp; Aerospace</option>
        </select>
      </div>

      <div class="va-customize-field">
        <span class="va-customize-label">COLOR THEME</span>
        <div class="va-theme-cards" role="radiogroup" aria-label="Color Theme">
          <button type="button" class="va-theme-card is-active" data-sheet-theme="white" role="radio" aria-checked="true">
            <span class="va-theme-swatch" aria-hidden="true"><span class="va-swatch-bar"></span><span class="va-swatch-accent"></span></span>
            <span>White</span>
          </button>
          <button type="button" class="va-theme-card" data-sheet-theme="paper" role="radio" aria-checked="false">
            <span class="va-theme-swatch" aria-hidden="true"><span class="va-swatch-bar"></span><span class="va-swatch-accent"></span></span>
            <span>Paper</span>
          </button>
          <button type="button" class="va-theme-card" data-sheet-theme="dark-paper" role="radio" aria-checked="false">
            <span class="va-theme-swatch" aria-hidden="true"><span class="va-swatch-bar"></span><span class="va-swatch-accent"></span></span>
            <span>Slate</span>

    padding: var(--density-card-pad);
    min-inline-size: 0;
  }

  .va-status-strip {
    min-block-size: 32px;
    padding: 0.35rem 0.75rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    flex-wrap: wrap;
    background: var(--bg-elevated);
    border-radius: var(--radius-inner);
    font-size: var(--ts-sm);
  }

  /* Control Primitives: Sleek >= 28-32px on Desktop/Foldable, >= 44px on Phone */
  button, .va-btn-primary, .va-btn-ghost, .va-pill-btn, select, input {
    min-block-size: 26px;
  }

  .va-btn-primary,
  .va-btn-ghost {
    min-block-size: 32px;
    padding: 0.35rem 0.85rem;
    font-family: var(--font-sans);
    font-size: var(--ts-sm);
    border-radius: var(--radius-sm);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    text-decoration: none;
  }

  .va-btn-primary {
    font-weight: 600;
    border: 1px solid transparent;
    background: var(--accent-primary);
    color: #FFFFFF;
  }

  .va-btn-ghost {
    font-weight: 500;
    border: 1px solid var(--border-strong);
    background: transparent;
    color: var(--text-primary);
  }

  .va-pill-btn {
    min-block-size: 28px;
    padding: 0.22rem 0.62rem;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    background: var(--bg-elevated);
    color: var(--text-secondary);
    font-family: var(--font-sans);
    font-size: var(--ts-xs);
    font-weight: 600;
    line-height: 1.2;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    cursor: pointer;
    white-space: nowrap;
  }

  .va-pill-btn:hover {
    border-color: var(--accent-primary);
    color: var(--text-primary);
  }

  .va-pill-btn.active,
  .va-pill-btn.is-active {
    background: var(--accent-primary);
    border-color: var(--accent-primary);
    color: #FFFFFF;
  }

  .va-figure-hdr .va-pill-btn {
    min-block-size: 26px;
    padding: 0.15rem 0.5rem;
    font-size: max(0.75rem, 11px);
  }

  /* Sidebar & Tree Link Primitives */
  .va-side-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    padding: 0.38rem 0.6rem;
    border-radius: var(--radius-sm);
    color: var(--text-secondary);
    font-family: var(--font-sans);
    font-size: var(--ts-xs);
    font-weight: 500;
    text-decoration: none;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .va-side-link:hover,
  .va-side-link.active,
  .va-side-link.is-active {
    background: var(--bg-elevated);
    color: var(--accent-primary);
    font-weight: 600;
  }
  .va-side-link-left {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    min-inline-size: 0;
  }

  pre {
    overflow-x: auto;
    max-inline-size: 100%;
    margin: 0;
  }

  /* Badges & Status */
  .va-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    font-size: var(--ts-xs);
    font-weight: 600;
    padding: 0.15rem 0.5rem;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-hairline);
    background: var(--bg-elevated);
    color: var(--text-secondary);
    line-height: 1.2;
    white-space: nowrap;
  }
  .va-badge-ok      { background: var(--status-ok-bg); color: var(--status-ok); border-color: var(--status-ok); }
  .va-badge-warn    { background: var(--status-warn-bg); color: var(--status-warn); border-color: var(--status-warn); }
  .va-badge-err     { background: var(--status-err-bg); color: var(--status-err); border-color: var(--status-err); }
  .va-badge-neutral { background: var(--bg-elevated); color: var(--text-secondary); border-color: var(--border-hairline); }

  .va-stale-badge {
    background: var(--status-warn-bg);
    color: var(--status-warn);
    border: 1px solid var(--status-warn);
    border-radius: var(--radius-sm);
    padding: 0.15rem 0.45rem;
    font-size: var(--ts-xs);
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
  }

  /* Prose Rhythm & Ceiling */
  .va-prose {
    font-size: var(--ts-prose);
    line-height: 1.65;
    color: var(--text-primary);
    min-inline-size: 0;
  }
  .va-prose h1 { line-height: 1.15; text-wrap: balance; margin: 0.25rem 0 0.5rem; font-size: var(--ts-xl); }
  .va-prose h2 { margin-block: 1.65rem 0.55rem; font-size: var(--ts-md); line-height: 1.28; }
  .va-prose h3 { margin-block: 1.15rem 0.4rem; font-size: var(--ts-base); }
  .va-prose p, .va-prose li { max-inline-size: 68ch; margin-block: 0 0.85rem; }

  /* Figures & SVG Schematics */
  .va-figure-card {
    margin: 1.1rem 0;
    background: var(--bg-surface);
    border: 1px solid var(--border-hairline);
    border-radius: var(--radius-card);
    padding: var(--density-card-pad);
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    min-inline-size: 0;
  }

  .va-figure-hdr {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    flex-wrap: wrap;
    font-size: var(--ts-sm);
  }

  .va-figure-caption {
    font-family: var(--font-sans);
    font-size: var(--ts-xs);
    color: var(--text-muted);
    line-height: 1.45;
    padding-top: 0.35rem;
    border-top: 1px solid var(--border-hairline);
  }

  .va-figure-scroll {
    overflow-x: auto;
    max-inline-size: 100%;
    min-inline-size: 0;
    -webkit-overflow-scrolling: touch;
  }

  .va-figure-scroll svg.va-schematic-svg {
    display: block;
    inline-size: 100%;
    min-inline-size: 540px;
    max-inline-size: 760px;
    block-size: auto;
    margin-inline: auto;
  }

  .va-mermaid-code {
    font-family: var(--font-mono);
    font-size: var(--ts-xs);
    overflow-x: auto;
    padding: 0.75rem;
    background: var(--bg-elevated);
    border-radius: var(--radius-inner);
    border: 1px solid var(--border-hairline);
    white-space: pre;
  }

  /* Responsive Data & Academic Booktabs Tables */
  .va-table-wrap {
    overflow-x: auto;
    max-inline-size: 100%;
    min-inline-size: 0;
    border: 1px solid var(--border-hairline);
    border-radius: var(--radius-card);
    background: var(--bg-surface);
  }

  table.va-data-table,
  table.booktabs {
    inline-size: 100%;
    border-collapse: collapse;
    font-size: var(--ts-xs);
    font-variant-numeric: var(--font-nums);
  }

  table.booktabs {
    border-top: 2px solid var(--border-strong);
    border-bottom: 2px solid var(--border-strong);
  }

  table.va-data-table th,
  table.va-data-table td,
  table.booktabs th,
  table.booktabs td {
    min-inline-size: 54px;
    padding: 0.42rem 0.55rem;
    text-align: left;
    border-bottom: 1px solid var(--border-hairline);
    overflow-wrap: normal;
    word-break: normal;
    vertical-align: middle;
  }

  table.va-data-table th,
  table.booktabs th {
    background: var(--bg-elevated);
    font-family: var(--font-sans);
    font-weight: 700;
    color: var(--text-muted);
    font-size: var(--ts-xs);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    white-space: nowrap;
    border-bottom: 1.5px solid var(--border-strong);
  }

  table.va-data-table td { white-space: nowrap; }
  table.booktabs td { white-space: normal; }
  table.booktabs td strong,
  table.booktabs td code { white-space: nowrap; }
}

@layer utilities {
  .mono { font-family: var(--font-mono); font-variant-numeric: var(--font-nums); }
  .tabular-nums { font-variant-numeric: var(--font-nums); }
  th.num, td.num, .num {
    text-align: right;
    font-family: var(--font-mono);
    font-variant-numeric: var(--font-nums);
    white-space: nowrap;
  }

  .math-bar { text-decoration: overline; }

  .va-bleed-wide { inline-size: 100%; max-inline-size: 100%; min-inline-size: 0; }

  .sq-status {
    display: inline-block;
    inline-size: 8px;
    block-size: 8px;
    border-radius: 2px;
    margin-right: 0.35rem;
    vertical-align: middle;
    background: var(--text-muted);
  }
  .sq-ok   { background: var(--status-ok); }
  .sq-warn { background: var(--status-warn); }
  .sq-err  { background: var(--status-err); }

  /* Phone Portrait (<480px / data-form-factor="touch") >= 44px Hit Targets */
  [data-form-factor="touch"] :is(button, .va-btn-primary, .va-btn-ghost, .va-pill-btn, .ann-ack-btn, select, input:not([type="checkbox"]):not([type="radio"]):not([type="range"])) {
    min-block-size: 44px;
  }

  @media (max-width: 480px) {
    button, .va-btn-primary, .va-btn-ghost, .va-pill-btn, .ann-ack-btn, select,
    input:not([type="checkbox"]):not([type="radio"]):not([type="range"]) {
      min-block-size: 44px;
    }
  }
}

   Variants:
     1. status       — ISA-101 / NUREG-0700 annunciator (quiet nominal; warn/fault framed)
     2. tag          — Monochrome metadata keycap (2px radius, neutral surface)
     3. chip         — Interactive 999px stadium capsule (strictly clickable controls)

@layer shell {
  /* Zero-Inflation Baseline Lock (22px row, 18px fixed pill box) */
  .qe-scalar-top,
  .qe-bit-meta,
  .qe-card-head {

    display: flex;
    align-items: center;
  }
  .qe-card-head { justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; }

  /* Universal .va-pill Construction Law */
  .va-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    block-size: 1.125rem;
    line-height: 1;
    box-sizing: border-box;
    vertical-align: middle;
    padding-inline: 0.42rem;
    border-radius: var(--radius-xs, 2px);
    border: 1px solid transparent;
    font-family: var(--font-mono);
    font-size: 0.6875rem;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    text-box: trim-both cap alphabetic;
  }

  /* Variant 1: ISA-101 / NUREG-0700 Status Annunciator */
  .va-pill[data-variant="status"][data-state="nominal"] {
    background: transparent;
    border-width: 0;
    padding-inline: 0;
    color: var(--text-secondary);
  }
  .va-pill[data-variant="status"][data-state="nominal"]::before {
    content: "";
    inline-size: 6px;
    block-size: 6px;
    border-radius: 50%;
    background: var(--text-muted);
    flex-shrink: 0;
  }

  .va-pill[data-variant="status"][data-state="warn"] {
    background: color-mix(in oklab, var(--status-warn) 10%, transparent);
    border: 1px solid color-mix(in oklab, var(--status-warn) 32%, transparent);
    border-inline-start: 2.5px solid var(--status-warn);
    color: var(--status-warn);
    font-weight: 600;

  .va-pill[data-variant="status"][data-state="warn"]::before {
    content: "▲";
    content: "▲" / "";
    font-size: 0.5625rem;
    line-height: 1;
    flex-shrink: 0;
  }

  .va-pill[data-variant="status"][data-state="fault"] {
    background: color-mix(in oklab, var(--status-danger) 12%, transparent);
    border: 1px solid color-mix(in oklab, var(--status-danger) 36%, transparent);
    border-inline-start: 2.5px solid var(--status-danger);
    color: var(--status-danger);
    font-weight: 600;
  }
  .va-pill[data-variant="status"][data-state="fault"]::before {
    content: "◆";
    content: "◆" / "";
    font-size: 0.625rem;
    line-height: 1;
    flex-shrink: 0;

    background: var(--bg-surface);

      scalerH: Math.round(height * scale),

      portalEl.style.height = '100%';

    state.lastViewKey = viewKey;
    const viewMeta = findView(worldObj, state.view);
    const iframe = document.getElementById('va-stage-portal');
    if (!iframe) return;
    updatePortalDimensions();
    if (state.studioView !== 'examples') {
      syncExternalMode(iframe);
      syncBarControls();
      syncUrlParams();
      return;
    }
    if (!viewMeta) return;
    if (iframe.dataset.externalMode) {
      delete iframe.dataset.externalMode;
      iframe.removeAttribute('src');
      state.isMounted = false;
    }
    if (!state.isMounted || !iframe.contentDocument || !iframe.contentDocument.getElementById('va-stage-main')) {
      state.renderedView = '';
      iframe.onload = function () { state.isMounted = true; updatePortalDimensions(); syncIframeDOM(); };
      iframe.srcdoc = buildIframeSrcDoc(viewMeta);
    } else {
      syncIframeDOM();
    }
    syncBarControls();
    syncUrlParams();
  }

  function openBridgeDialog() {
    const worldObj = findWorld(state.world);
    const viewMeta = findView(worldObj, state.view);
    if (window.QuietStudioSheetV9) window.QuietStudioSheetV9.openBridgeDialog(worldObj, viewMeta);
  }

  function printActiveStage() {
    const iframe = document.getElementById('va-stage-portal');
    if (iframe && iframe.contentWindow) { iframe.contentWindow.focus(); iframe.contentWindow.print(); }
  }

  function stepView(delta) {
    const worldObj = findWorld(state.world);
    if (!worldObj || !worldObj.views.length) return;
    const list = worldObj.views;
    let idx = list.findIndex(function (v) { return v.view_id === state.view; });
    idx = (idx + delta + list.length) % list.length;
    state.view = list[idx].view_id;
    if (window.QuietStudioSheetV9) window.QuietStudioSheetV9.untuckStudioBar();
    applyState(false);
  }

  function initControls() {
    const bind = function (id, fn) { const el = document.getElementById(id); if (el) el.addEventListener('click', fn); };
    const tablist = document.getElementById('va-studio-mode-tablist');
    if (tablist) {
      tablist.addEventListener('click', function (ev) {
        const btn = ev.target && ev.target.closest ? ev.target.closest('[data-studio-tab]') : null;
        if (btn && ['examples', 'components'].indexOf(btn.dataset.studioTab) !== -1) {
          state.studioView = btn.dataset.studioTab;
          applyState(false);
        }
      });
    }
    const dSel = document.getElementById('va-domain-select');
    if (dSel) dSel.addEventListener('change', function (e) { state.world = e.target.value; applyState(true); });
    const vSel = document.getElementById('va-view-select');
    if (vSel) vSel.addEventListener('change', function (e) { state.view = e.target.value; applyState(false); });
    ['density', 'corners'].forEach(function (k) {
      const el = document.getElementById('va-' + k + '-select');
      if (el) el.addEventListener('change', function (e) { state[k] = e.target.value; applyState(false); });
    });
    const onRotate = function () { const d = getActiveDimensions(); if (d) { state.vp = d.height + 'x' + d.width; applyState(false); } };
    const onZoomToggle = function () { state.zoom = (state.zoom === 'fit') ? '1:1' : 'fit'; updatePortalDimensions(); syncBarControls(); syncUrlParams(); };
    [
      ['va-step-prev', function () { stepView(-1); }], ['va-step-next', function () { stepView(1); }],
      ['va-bridge-btn', openBridgeDialog],
      ['va-customize-btn', function () { const s = document.getElementById('va-customize-sheet'); if (s && s.showModal) s.showModal(); }],
    ].forEach(function (pair) { bind(pair[0], pair[1]); });
    if (window.QuietStudioSheetV9) window.QuietStudioSheetV9.initSheetEvents(state, applyState, onRotate, onZoomToggle, printActiveStage);
    window.addEventListener('resize', function () {
      if (window.innerWidth >= 700 && window.QuietStudioSheetV9) window.QuietStudioSheetV9.untuckStudioBar();
      updatePortalDimensions();
      if (state.studioView === 'examples') syncIframeDOM();
    });
    window.QuietPortalResize.initResizeHandles(
      document.getElementById('va-portal-scaler'), document.getElementById('va-stage-portal'), document.getElementById('va-portal-mat'),
      function (w, h) { state.vp = w + 'x' + h; if (state.studioView === 'examples') syncIframeDOM(); syncUrlParams(); syncBarControls(); }
    );
  }

  window.addEventListener('DOMContentLoaded', function () {
    loadManifest();
    readUrlParams();
    initControls();
    applyState(false);
  });
  window.QuietStudioPortalV9 = { state: state, applyState: applyState, openBridgeDialog: openBridgeDialog };
})(window, document);

  </script>
</body>
</html>
