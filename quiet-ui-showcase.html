/* SPDX-License-Identifier: MIT */
/* ==========================================================================
   Quiet UI v8.0.1 — Single-Row 44px Outer Studio Bar & Portal Scaler Chrome
   ========================================================================== */

html.va-studio-root,
body.va-studio-body {
  margin: 0;
  padding: 0;
  block-size: 100dvh;
  inline-size: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #070B12;
  color: #F8FAFC;
  font-size: 13px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
}

*, *::before, *::after { box-sizing: border-box; }
summary { list-style: none; }
summary::-webkit-details-marker { display: none; }

/* Single-Row 44px Studio Header */
#va-studio-bar,
.va-studio-bar {
  block-size: 44px;
  min-block-size: 44px;
  max-block-size: 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: nowrap;
  gap: 0.4rem;
  padding: 0 0.5rem;
  background: #0F172A;
  border-bottom: 1px solid #1E293B;
  z-index: 100;
  flex-shrink: 0;
  overflow: hidden;
  transition: margin-top 0.18s ease, transform 0.18s ease;
}

#va-studio-bar.is-tucked {
  margin-top: -44px;
  transform: translateY(-100%);
}

.va-bar-left,
.va-bar-right {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  flex: 0 0 auto;
  min-inline-size: 0;
}

.va-bar-center {
  display: flex;
  align-items: center;
  gap: 0.25rem;
  flex: 1 1 auto;
  min-inline-size: 0;
  max-inline-size: 460px;
}

/* Segmented Parent Mode Pill [UI | Atlas] */
.va-mode-tablist {
  display: inline-flex;
  align-items: center;
  background: #070B12;
  border: 1px solid #334155;
  border-radius: 7px;
  padding: 2px;
  gap: 2px;
}

.va-mode-tab {
  min-block-size: 26px;
  padding: 0 0.5rem;
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: #94A3B8;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
}
.va-mode-tab:hover { color: #F8FAFC; }
.va-mode-tab.is-active { background: #2563EB; color: #FFFFFF; }

/* Brand Mark: Hidden <700px, 18px icon 700-1099px, Full Badge >=1100px */
.va-studio-brand {
  font-weight: 700;
  font-size: 12.5px;
  color: #F8FAFC;
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  white-space: nowrap;
}
.va-brand-icon { inline-size: 18px; text-align: center; color: #38BDF8; font-size: 13px; }
.va-brand-text { display: inline-flex; align-items: center; gap: 0.3rem; }
.va-studio-badge {
  font-size: 11px;
  font-weight: 600;
  background: #1E293B;
  color: #38BDF8;
  padding: 1px 5px;
  border-radius: 4px;
  border: 1px solid #334155;
}

/* Center Stepper & Action Buttons */
.va-step-btn {
  min-block-size: 30px;
  inline-size: 28px;
  padding: 0;
  border: 1px solid #334155;
  border-radius: 6px;
  background: #1E293B;
  color: #CBD5E1;
  font-size: 11px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
}
.va-step-btn:hover { background: #334155; color: #FFFFFF; }

.va-studio-select,
.va-studio-btn {
  min-block-size: 30px;
  padding: 0.15rem 0.45rem;
  border: 1px solid #334155;
  border-radius: 6px;
  background: #1E293B;
  color: #F1F5F9;
  font-size: 12px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.3rem;
  white-space: nowrap;
  font-family: inherit;
}
.va-tier-select {
  inline-size: 100%;
  min-inline-size: 0;
  flex: 1 1 auto;
  overflow: hidden;
  text-overflow: ellipsis;
}
.va-studio-select:hover,
.va-studio-btn:hover { background: #334155; }
.va-studio-btn.is-active { background: #2563EB; border-color: #3B82F6; color: #FFFFFF; }

/* Labeled Inline Selects (Nav: Auto, Stage: Fill) */
.va-inline-ctrl {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  min-block-size: 30px;
  padding: 0 0.4rem;
  border: 1px solid #334155;
  border-radius: 6px;
  background: #1E293B;
  color: #CBD5E1;
  font-size: 11.5px;
  white-space: nowrap;
}
.va-ctrl-prefix { color: #94A3B8; font-weight: 600; font-size: 11px; }
.va-ctrl-bare-select {
  border: 0;
  background: transparent;
  color: #F8FAFC;
  font-size: 12px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  outline: none;
  padding-right: 0.15rem;
}
.va-ctrl-bare-select option { background: #0F172A; color: #F8FAFC; }

/* 4 Tactile Theme Dots */
.va-theme-dots {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 0 0.3rem;
  min-block-size: 30px;
  background: #070B12;
  border: 1px solid #1E293B;
  border-radius: 999px;
}
.va-theme-dot {
  inline-size: 16px;
  block-size: 16px;
  padding: 0;
  border-radius: 999px;
  border: 1.5px solid #475569;
  cursor: pointer;
}
.va-theme-dot[data-theme-dot="white"] { background: #FFFFFF; }
.va-theme-dot[data-theme-dot="paper"] { background: #F5F2EB; }
.va-theme-dot[data-theme-dot="dark-paper"] { background: #262420; }
.va-theme-dot[data-theme-dot="dark"] { background: #090D16; }
.va-theme-dot.is-active {
  box-shadow: 0 0 0 2px #070B12, 0 0 0 3.5px #38BDF8;
  border-color: #FFFFFF;
}

/* Gear Button & 6px Active Non-Default Indicator Dot */
.va-gear-btn { position: relative; min-inline-size: 30px; }
.va-settings-dot {
  position: absolute;
  top: 4px;
  right: 4px;
  inline-size: 6px;
  block-size: 6px;
  border-radius: 999px;
  background: #38BDF8;
}

.va-stage-tools { display: inline-flex; align-items: center; gap: 0.25rem; }
.va-stage-tools[hidden],
.va-settings-dot[hidden] { display: none; }
html[data-studio-view="diagrams"] .va-ui-only { display: none; }

/* Viewport-Adaptive Breakpoints (<700px | 700-1099px | >=1100px) */
@media (max-width: 699px) {
  .va-studio-brand, .va-fold-up, .va-desktop-only { display: none; }
  .va-phone-only { display: inline-flex; }
}
@media (min-width: 700px) and (max-width: 1099px) {
  .va-brand-text, .va-phone-only, .va-desktop-only { display: none; }
}
@media (min-width: 1100px) {
  .va-phone-only { display: none; }
}

#va-portal-mat {
  flex: 1;
  min-block-size: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  background: #070B12;
  user-select: none;
}

#va-portal-scaler {
  position: relative;
  box-shadow: 0 20px 48px rgba(0, 0, 0, 0.55);
  transition: width 0.12s ease-out, height 0.12s ease-out;
  background: #090D16;
}

#va-stage-portal {
  border: none;
  background: #090D16;
  display: block;
}

/* Hinge Guide for 820x1180 Fold Diagnostics */
.va-hinge-guide {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  width: 2px;
  transform: translateX(-50%);
  border-left: 2px dashed rgba(56, 189, 248, 0.55);
  pointer-events: none;
  z-index: 25;
  display: none;
}

#va-portal-scaler.has-hinge .va-hinge-guide {
  display: block;
}

/* Resize Drag Handles */
.va-drag-handle {
  position: absolute;
  z-index: 30;
}

.va-drag-w {
  left: -6px;
  top: 0;
  bottom: 0;
  width: 12px;
  cursor: ew-resize;
}

.va-drag-e {
  right: -6px;
  top: 0;
  bottom: 0;
  width: 12px;
  cursor: ew-resize;
}

.va-drag-s {
  bottom: -6px;
  left: 0;
  right: 0;
  height: 12px;
  cursor: ns-resize;
}

/* Studio Settings Sheet (<700px bottom sheet | >=700px anchored popover) */
dialog#va-customize-sheet {
  border: 1px solid #334155;
  background: #0F172A;
  color: #F8FAFC;
  padding: 0.9rem 1rem;
  box-shadow: 0 20px 48px rgba(0, 0, 0, 0.58);
  margin: 50px 0.65rem auto auto;
  inline-size: 360px;
  max-inline-size: calc(100vw - 1.3rem);
  max-block-size: calc(100dvh - 64px);
  overflow-y: auto;
  border-radius: 10px;
}

@media (max-width: 699px) {
  dialog#va-customize-sheet {
    margin: auto 0 0 0;
    inline-size: 100%;
    max-inline-size: 100%;
    max-block-size: 82dvh;
    border-radius: 14px 14px 0 0;
    border-bottom: 0;
    padding: 1rem;
  }
}

dialog#va-customize-sheet::backdrop {
  background: rgba(7, 11, 18, 0.55);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
}

.va-customize-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 0.75rem;
  padding-bottom: 0.5rem;
  border-bottom: 1px solid #1E293B;
  font-size: 13px;
}

.va-sheet-sections {
  display: flex;
  flex-direction: column;
  gap: 0.7rem;
}

.va-customize-field {
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
}

.va-customize-row-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.5rem;
}

.va-customize-label {
  font-size: 11px;
  font-weight: 700;
  color: #94A3B8;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.va-sheet-seg {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 0.3rem;
}

.va-sheet-seg-btn {
  min-block-size: 32px;
  padding: 0.2rem 0.35rem;
  border: 1px solid #334155;
  border-radius: 6px;
  background: #1E293B;
  color: #CBD5E1;
  font-size: 11.5px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
}

.va-sheet-seg-btn.is-active {
  background: #2563EB;
  border-color: #3B82F6;
  color: #FFFFFF;
}

.va-sheet-stage-row {
  display: flex;
  align-items: center;
  gap: 0.35rem;
}

.va-sheet-stage-row .va-studio-select {
  flex: 1 1 auto;
}

.va-prompt-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.4rem;
}

.va-prompt-preview {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  color: #94A3B8;
  background: #070B12;
  border: 1px solid #1E293B;
  border-radius: 5px;
  padding: 0.35rem 0.5rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1 1 auto;
}

    { id: 'm2', name: 'Mars 2026 Opposition', baseDist: 0.52, reqMargin: 4.5 },

    { id: 'm5', name: 'Deep Space Lunar Gateway', baseDist: 0.0026, reqMargin: 6.0 },
    { id: 'm6', name: 'JWST L2 Halo Orbit', baseDist: 0.01, reqMargin: 5.5 },
    { id: 'm7', name: 'Lagrange Sun-Earth L1', baseDist: 0.01, reqMargin: 5.5 },
    { id: 'm8', name: 'Asteroid Sample Return', baseDist: 1.8, reqMargin: 3.5 }
  ];

  window.updateBridge1Calc = function() {
    const distEl = document.getElementById('b1-dist-au');
    const apEl = document.getElementById('b1-aperture-cm');
    const pwrEl = document.getElementById('b1-power-w');
    const effEl = document.getElementById('b1-eff-pct');
    if (!distEl || !apEl || !pwrEl) return;

    const r = parseFloat(distEl.value) || 1.0;
    const d = parseFloat(apEl.value) || 22;
    const p = parseFloat(pwrEl.value) || 1250;
    const eff = effEl ? (parseFloat(effEl.value) || 45) : 45;

    const setTxt = function(id, v) { const el = document.getElementById(id); if (el) el.textContent = v; };
    setTxt('b1-dist-val', r.toFixed(2) + ' AU');
    setTxt('b1-aperture-val', d.toFixed(0) + ' cm');
    setTxt('b1-power-val', p.toFixed(0) + ' W');
    if (effEl) setTxt('b1-eff-val', eff.toFixed(0) + '%');

    // Link physics calculation
    const rate = Math.min(267.0, Math.max(0.5, 67.5 * Math.pow(1.0 / r, 2) * Math.pow(d / 22.0, 2) * (p / 1250.0) * (eff / 45.0)));
    const margin = Math.max(-2.0, Math.min(14.0, 4.2 + 3.0 * Math.log10((d / 22.0) * (p / 1250.0) * (eff / 45.0) / r)));

    setTxt('b1-rate-out', rate.toFixed(1) + ' Mbps');
    setTxt('b1-margin-out', (margin >= 0 ? '+' : '') + margin.toFixed(1) + ' dB');
    setTxt('b1-ppm-out', rate >= 120 ? 'M=16 SCPPM' : (rate >= 25 ? 'M=64 SCPPM' : 'M=128 SCPPM'));

    const dot = document.getElementById('b1-op-dot');

      dot.setAttribute('cx', (50 + Math.min(1.0, (r - 0.1) / 2.7) * 380).toFixed(1));

      const row = document.getElementById('b1-row-' + m.id);

      const mRatio = m.baseDist / r;
      const mRate = Math.min(267.0, Math.max(0.1, rate * Math.pow(1.0 / mRatio, 2)));
      const mMargin = margin - 3.0 * Math.log10(mRatio);
      const isPass = mMargin >= m.reqMargin;

      const rateCell = row.querySelector('.col-rate');
      const marginCell = row.querySelector('.col-margin');
      const statusCell = row.querySelector('.col-status');

      if (rateCell) rateCell.textContent = mRate >= 1.0 ? mRate.toFixed(1) + ' Mbps' : (mRate * 1000).toFixed(0) + ' kbps';

    if (valEl) {

      const unit = valEl.textContent.indexOf('kPa') !== -1 ? ' kPa' : (valEl.textContent.indexOf('°C') !== -1 ? ' °C' : ' W');
      valEl.textContent = (cur + delta).toFixed(1) + unit;
    }
  };

  // Two-Step Guarded Actuation (ARM -> EXECUTE) with 5-second safety disarm timeout
  const armTimers = {};

  window.armGuardedActuator = function(actuatorId, armBtn) {
    const card = armBtn ? armBtn.closest('.guarded-actuator-card') : document.querySelector('[data-actuator="' + actuatorId + '"]');
    if (!card) return;
    const execBtn = card.querySelector('.execute-btn');
    const isArmed = card.classList.contains('is-armed');

    if (isArmed) {
      // Disarm manually
      disarmActuator(actuatorId, card, armBtn, execBtn);
    } else {
      // Engage Arm state
      card.classList.add('is-armed');
      armBtn.classList.add('is-active');

      armBtn.innerHTML = '<i class="fa-solid fa-lock-open"></i> DISARM (5s)';
      if (execBtn) execBtn.removeAttribute('disabled');

      // Start 5s countdown
      let remaining = 5;
      if (armTimers[actuatorId]) clearInterval(armTimers[actuatorId]);
      armTimers[actuatorId] = setInterval(function() {

        if (remaining > 0) {

    card.classList.remove('is-armed');

            <strong>Abstract</strong> — The Psyche Deep Space Optical Communications (DSOC) technology demonstration represents the first operational implementation of photon-efficient optical downlink communications from interplanetary distances spanning 0.1 to 2.6 Astronomical Units (AU). This paper presents the end-to-end transceiver physical architecture, including the 22 cm clear-aperture flight optical assembly, active disturbance isolation assembly, and the cryogenic superconducting nanowire single-photon detector (SNSPD) array ground receiver at the Palomar 5.1 m Hale Telescope. Using Serially Concatenated Pulse Position Modulation (SCPPM, <i>M</i> = 4..128), the system achieved 267.0 Mbps at near conjunction and sustained high-rate carrier syntonization with sub-picosecond residual phase jitter across deep space.
          </p>

        <!-- Section 1.0 -->
        <section id="doc1-sec-1">
          <h2>1.0 Flight Transceiver Configuration &amp; Disturbance Isolation</h2>
          <p>
            Operating an optical terminal across deep-space baselines requires angular point-ahead precision on the order of sub-microradians while isolating the laser transmitter from spacecraft reaction-wheel vibrations. The DSOC flight assembly integrates a 22 cm clear-aperture Cassegrain telescope supported by a magnetic hexapod disturbance isolation platform that attenuates high-frequency host spacecraft jitter above 2 Hz <sup class="cite-ref" onmouseenter="highlightDoc1Sidenote('sn-1', true)" onmouseleave="highlightDoc1Sidenote('sn-1', false)">[1]</sup>.
          </p>
          <p>
            Downlink optical power is generated by an erbium-doped fiber laser amplifier emitting 1.25 kW peak pulse power at 1550 nm. Uplink beacon acquisition and coarse pointing are established via Table Mountain Observatory using an arrayed 1064 nm beacon laser. The point-ahead mirror introduces calibrated relativistic compensation offsets up to &plusmn;33.4 &mu;rad along the trajectory vector <sup class="cite-ref" onmouseenter="highlightDoc1Sidenote('sn-2', true)" onmouseleave="highlightDoc1Sidenote('sn-2', false)">[2]</sup>.
          </p>

        <!-- Section 3.0 with Numbered Mathematical Equations -->
        <section id="doc1-sec-3">
          <h2>3.0 Phase Stability &amp; Mathematical Formulations</h2>
          <p>
            The frequency stability of the downstream slot clock is governed by the two-sample Modified Allan Variance <i>&sigma;<sub>y</sub></i><sup>2</sup>(<i>&tau;</i>), defined over <i>M</i> fractional frequency samples averaged over time interval <i>&tau;</i>:
          </p>
          <div class="doc1-equation" role="region" aria-label="Equation 1.1 Modified Allan Variance">
            <span>&sigma;<sub>y</sub><sup>2</sup>(&tau;) = [1 / 2(M &minus; 1)] &middot; &sum; (<span class="math-bar">y</span><sub>k+1</sub> &minus; <span class="math-bar">y</span><sub>k</sub>)<sup>2</sup></span>
            <span class="doc1-eq-num">(Eq. 1)</span>
          </div>
          <p>
            The free-space path loss <i>L</i><sub>free</sub> over interplanetary range <i>R</i> at carrier wavelength <i>&lambda;</i> = 1550 nm is expressed as:
          </p>
          <div class="doc1-equation" role="region" aria-label="Equation 1.2 Free-Space Geometric Loss">
            <span>L<sub>free</sub> = (4 &middot; &pi; &middot; R / &lambda;)<sup>2</sup> &nbsp;&nbsp;[dimensionless ratio]</span>
            <span class="doc1-eq-num">(Eq. 2)</span>
          </div>
          <p>
            Accounting for ground collector effective aperture <i>A</i><sub>eff</sub>, atmospheric transmittance <i>&eta;</i><sub>atm</sub>, and quantum photon energy <i>h&nu;</i>, the received signal photon flux <i>N</i><sub>rx</sub> per slot period <i>T</i><sub>s</sub> satisfies:
          </p>
          <div class="doc1-equation" role="region" aria-label="Equation 1.3 Received Signal Photon Flux">
            <span>N<sub>rx</sub> = (P<sub>tx</sub> &middot; G<sub>tx</sub> &middot; A<sub>eff</sub> &middot; &eta;<sub>atm</sub> &middot; T<sub>s</sub>) / (4 &middot; &pi; &middot; R<sup>2</sup> &middot; h &middot; &nu;)</span>
            <span class="doc1-eq-num">(Eq. 3)</span>
          </div>
          <p>
            Equation (3) reveals that high throughput at 2.6 AU requires minimizing slot width down to <i>T</i><sub>s</sub> = 500 ps while scaling ground receiver photon sensitivity via cryogenic detector arrays <sup class="cite-ref" onmouseenter="highlightDoc1Sidenote('sn-4', true)" onmouseleave="highlightDoc1Sidenote('sn-4', false)">[4]</sup>.
          </p>
        </section>

        <!-- Section 4.0: Ground Collector Architecture -->
        <section id="doc1-sec-4">
          <h2>4.0 Ground Segment Collector &amp; Palomar 5.1m SNSPD Array</h2>
          <p>
            Optical downlink reception is executed by the 5.1 m Hale Telescope at Palomar Mountain, supplemented by the Deep Space Network 34 m BWG hybrid RF-optical aperture (DSS-13) at Goldstone <sup class="cite-ref" onmouseenter="highlightDoc1Sidenote('sn-5', true)" onmouseleave="highlightDoc1Sidenote('sn-5', false)">[5]</sup>. The Palomar prime-focus optical receiver integrates a 64-element tungsten silicide (WSi) SNSPD array operated at a cryogenic temperature of 0.85 K inside a closed-cycle helium sorption refrigerator.
          </p>
          <p>

        <p>
          NASA Space Technology Mission Directorate (STMD) established the Deep Space Optical Communications project to address the bandwidth bottleneck of deep space telemetry. As scientific imaging and hyperspectral instruments generate tens of terabytes per mission conjunction, traditional Ka-band radio frequency (RF) downlinks operating between 500 kbps and 2 Mbps impose severe data discard policies.
        </p>
        <p>
          Following successful in-flight demonstration of 267 Mbps at close range and 1.0 Mbps at 2.6 AU, this memorandum codifies the formal approval of Option B: Hybrid Optical/RF Architecture as the standard flight baseline for outer-planet missions.
        </p>
      </section>

        </div>

      <!-- Section 1.0: Scope & Normative Definition -->
      <section class="doc3-sec">
        <h2>1.0 Purpose &amp; Scope of Normative Specification</h2>
        <p>
          This document establishes the normative syntax, bitfield packet encoding, and state machine transition rules for the Space Packet Protocol (CCSDS 133.0-B-2). The protocol provides unidirectional or bidirectional data transfer services across deep space telemetry links, accommodating variable-length user application packets across optical and radio-frequency space-to-ground conduits.
        </p>
      </section>

      <!-- Section 2.0: 6-Byte Bitfield Primary Header SVG Diagram -->
      <section class="doc3-sec">
        <h2>2.0 Primary Header Structure &amp; 48-Bit Bitfield Architecture</h2>

          Every Space Packet shall comprise a mandatory 6-byte (48-bit) Packet Primary Header, followed by an optional Packet Secondary Header and a variable-length Packet Data Field. Figure 3.1 details the exact bit allocation across the 6 octets:
        </p>

      <!-- Section 3.0: Filterable 14-Clause Normative Ledger -->
      <section class="doc3-sec">
        <h2>3.0 Normative Requirements Ledger &amp; Conformance Clauses</h2>
        <div class="rfc-filter-bar">
          <span style="font-family:var(--font-sans); font-size:var(--ts-xs); font-weight:600; margin-right:0.5rem;">FILTER CLAUSES:</span>

      <!-- Section 4.0: Protocol FSM & State Transition Model -->
      <section class="doc3-sec">

        <p>
          The protocol processing receiver implements a deterministic 5-state finite automaton governing frame synchronization, sequence check, and buffer disposition:

          <h1 class="doc4b-title">Deep Space Optical Ground Terminal SDK &amp; FPGA MMIO Reference</h1>
          <p class="doc4b-summary">
            Authoritative API and hardware specification for automated telemetry capture, beam pointing calibration, and iterative soft-decision decoding of CCSDS 142.0-B-1 optical downlink signals.
          </p>

        <!-- 1. 6-Stage Numbered Flow Spine (.va-flow-spine) -->
        <section id="doc4b-sec-pipeline" class="doc4b-sec">
          <h2>1.0 The 6-Stage Syntonization &amp; Acquisition Pipeline</h2>

              <span class="step-label">Discover</span>

            <div class="spine-arrow">&rarr;</div>

              <span class="step-label">Configure</span>

            </div>
            <div class="spine-arrow">&rarr;</div>

              <span class="step-label">Calibrate</span>

        <!-- 3. 32-Bit FPGA MMIO Register Map -->
        <section id="doc4b-sec-registers" class="doc4b-sec">
          <h2>2.1 32-Bit FPGA MMIO Register Architecture (BAR0)</h2>
          <p>
            The physical hardware demodulator exposes an aligned 32-bit register address space over PCIe BAR0 mapped at base offset <code>0xF000_0000</code>:
          </p>

          <div class="va-bleed-wide">
            <div class="va-table-wrap" role="region" tabindex="0" aria-label="Table 4.2 FPGA Register Map">
              <table class="booktabs" id="doc4b-register-table">
                <thead>
                  <tr>
                    <th>Offset</th>
                    <th>Mnemonic</th>
                    <th>Access</th>
                    <th>Reset Hex</th>
                    <th>Bitfield Definition &amp; Behavior</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td><code>0x0000</code></td>
                    <td><code>REG_ID_CODE</code></td>
                    <td>RO</td>
                    <td><code>0x44534F43</code></td>
                    <td>Hardware ID ASCII bytes: <code>'D','S','O','C'</code>.</td>
                  </tr>
                  <tr>
                    <td><code>0x0004</code></td>
                    <td><code>REG_HW_VERSION</code></td>
                    <td>RO</td>
                    <td><code>0x00030402</code></td>
                    <td>Major version 3 [31:24], Minor 4 [23:16], Patch 2 [15:0].</td>
                  </tr>
                  <tr>
                    <td><code>0x0010</code></td>
                    <td><code>REG_LOCK_STAT</code></td>
                    <td>RO</td>
                    <td><code>0x00000000</code></td>
                    <td>Bit 0: Beacon Lock; Bit 1: Clock Locked; Bit 2: Frame Sync.</td>
                  </tr>
                  <tr>
                    <td><code>0x0020</code></td>
                    <td><code>REG_PPM_CONFIG</code></td>
                    <td>RW</td>
                    <td><code>0x00000040</code></td>
                    <td>Order M [7:0]: 4, 8, 16, 32, 64, 128; Iterations [15:8]: 1..20.</td>
                  </tr>
                  <tr>
                    <td><code>0x0028</code></td>
                    <td><code>REG_SLOT_WIDTH</code></td>
                    <td>RW</td>
                    <td><code>0x000001F4</code></td>
                    <td>Slot clock duration in picoseconds (default 500 ps = 0.5 ns).</td>
                  </tr>
                  <tr>
                    <td><code>0x0030</code></td>
                    <td><code>REG_FRAME_COUNT</code></td>
                    <td>RO</td>
                    <td><code>0x00000000</code></td>
                    <td>Monotonically incrementing 32-bit received frame counter.</td>
                  </tr>
                  <tr>
                    <td><code>0x0034</code></td>
                    <td><code>REG_ERR_COUNT</code></td>
                    <td>RO</td>
                    <td><code>0x00000000</code></td>
                    <td>Uncorrectable codeblock frame error counter (FER).</td>
                  </tr>
                  <tr>
                    <td><code>0x0040</code></td>
                    <td><code>REG_INT_MASK</code></td>
                    <td>RW</td>
                    <td><code>0x00000007</code></td>
                    <td>Interrupt enable: Bit 0 (Lock Lost), Bit 1 (Sync), Bit 2 (Overflow).</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </section>

        <!-- 4. Python & CLI SDK Reference -->
        <section id="doc4b-sec-sdk" class="doc4b-sec">
          <h2>3.1 GroundTerminal API Reference</h2>
          <dl class="doc4b-api-list">
            <dt class="sig-band">
              <span class="sig-name">GroundTerminal.verify_beacon_lock</span>
              <span class="sig-args">(facility: str, max_urad: float = 0.50) &rarr; BeaconLockResult</span>
            </dt>
            <dd class="sig-body">
              <p>Polls the Table Mountain 1064 nm uplink beacon sensor and verifies that beam centroid jitter is within acceptable limits for closed-loop fine steering tracking.</p>
              <div class="sig-params">
                <strong>Parameters:</strong> <code>facility</code> (e.g. <code>'table-mountain'</code>), <code>max_urad</code> (maximum allowable RMS jitter).
              </div>
              <div class="sig-returns">
                <strong>Returns:</strong> <code>BeaconLockResult</code> with attributes <code>is_locked</code>, <code>rms_urad</code>, <code>snr_db</code>.
              </div>
            </dd>
          </dl>

          <div class="doctest-box">
            <div class="doctest-hdr"><span>PYTHON DOCTEST</span><button type="button" class="va-pill-btn" onclick="navigator.clipboard.writeText('from dsoc_sdk import GroundTerminal\nterm = GroundTerminal(\'table-mountain\')\nres = term.verify_beacon_lock(max_urad=0.50)\nassert res.is_locked is True')"><i class="fa-solid fa-copy"></i> Copy</button></div>
            <pre class="doctest-code">
&gt;&gt;&gt; from dsoc_sdk import GroundTerminal

True
&gt;&gt;&gt; res.rms_urad &lt;= 0.50
True
            </pre>
          </div>

          <h2>3.2 ScppmDecoder API Reference</h2>
          <dl class="doc4b-api-list">
            <dt class="sig-band">
              <span class="sig-name">ScppmDecoder.configure</span>
              <span class="sig-args">(ppm_order: int = 64, code_rate: str = "1/2", slot_ps: int = 500) &rarr; None</span>
            </dt>
            <dd class="sig-body">
              <p>Programs the FPGA hardware baseband demodulator to match downlink symbol timing and initiates soft-decision trellis decoding across received photon arrival records.</p>
            </dd>
          </dl>

          <div class="doctest-box">
            <div class="doctest-hdr"><span>PYTHON DECODER DOCTEST</span></div>
            <pre class="doctest-code">
&gt;&gt;&gt; from dsoc_sdk import ScppmDecoder
&gt;&gt;&gt; decoder = ScppmDecoder(base_addr=0xF000_0000)
&gt;&gt;&gt; decoder.configure(ppm_order=64, slot_ps=500)
&gt;&gt;&gt; decoder.is_syntonized()
True
            </pre>
          </div>
        </section>
      </article>
    </div>
  </section>

    const availH = Math.max(100, matEl.clientHeight - 28);

    if (!scalerEl || !portalEl || !matEl) return;

      portalEl.style.height = '100%';

    const fit = computeScale(dims.width, dims.height, matEl, zoomMode);

    const isFold = (dims.width === 820 && dims.height === 1180) ||
                   (dims.width === 1180 && dims.height === 820);
    scalerEl.classList.toggle('has-hinge', isFold);

    scalerEl.style.width = fit.scalerW + 'px';
    scalerEl.style.height = fit.scalerH + 'px';
    portalEl.style.width = dims.width + 'px';
    portalEl.style.height = dims.height + 'px';
    portalEl.style.transform = 'scale(' + fit.scale + ')';
    portalEl.style.transformOrigin = 'top left';
  }

  function initResizeHandles(scalerEl, portalEl, matEl, onResizeEnd) {
    if (!scalerEl) return;

    let isDragging = false;
    let dragDir = '';
    let startX = 0;
    let startY = 0;
    let startW = 0;
    let startH = 0;

    function onMouseDown(e) {
      const handle = e.target.closest('.va-drag-handle');
      if (!handle) return;

                handle.classList.contains('va-drag-e') ? 'e' : 's';

      startY = e.clientY;

      startH = parseInt(portalEl.style.height, 10) || scalerEl.clientHeight;

      document.addEventListener('mouseup', onMouseUp);

        newW = Math.max(320, startW - (e.clientX - startX) * 2);

      document.removeEventListener('mouseup', onMouseUp);

      const finalH = parseInt(portalEl.style.height, 10);

      '  <header id="va-shell-topbar" class="va-shell-topbar"><a class="va-shell-brand" href="#stage"><i class="fa-solid fa-book-open"></i> DSOC Monograph</a>' +
      '<nav class="va-shell-topbar-links" aria-label="Primary Navigation"><a class="va-shell-topbar-link is-active" href="#stage">Abstract</a><a class="va-shell-topbar-link" href="#stage">Optical Stack</a></nav>' +
      '<button type="button" id="va-drawer-open-btn" class="va-btn-ghost" aria-label="Open Navigation Drawer" onclick="openShellDrawer()"><i class="fa-solid fa-bars" aria-hidden="true"></i></button></header>\n' +
      '  <aside id="va-shell-rail" class="va-shell-rail" aria-label="Workspace Rail"><a class="va-rail-link is-active" href="#stage"><i class="fa-solid fa-compass" aria-hidden="true"></i> Abstract</a>' +
      '<a class="va-rail-link" href="#stage"><i class="fa-solid fa-wave-square" aria-hidden="true"></i> Optical Stack</a><a class="va-rail-link" href="#stage"><i class="fa-solid fa-sliders" aria-hidden="true"></i> Link Ledger</a></aside>\n' +
      '  <main id="va-stage-main" class="va-stage"></main>\n' +
      '  <nav id="va-shell-bottomdock" class="va-shell-bottomdock" aria-label="Mobile Dock"><button type="button" class="is-active"><i class="fa-solid fa-compass" aria-hidden="true"></i>Abstract</button>' +
      '<button type="button"><i class="fa-solid fa-wave-square" aria-hidden="true"></i>Optical</button><button type="button"><i class="fa-solid fa-sliders" aria-hidden="true"></i>Ledger</button>' +
      '<button type="button" onclick="openShellDrawer()"><i class="fa-solid fa-bars" aria-hidden="true"></i>Menu</button></nav>\n' +
      '  <dialog id="va-shell-drawer" closedby="any" aria-label="Navigation Drawer"><div class="va-drawer-header"><strong>Mission Navigation</strong><button type="button" class="va-btn-ghost" aria-label="Close Drawer" onclick="closeShellDrawer()"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></div>' +
      '<nav class="va-drawer-nav"><a class="va-drawer-link" href="#stage">Abstract</a><a class="va-drawer-link" href="#stage">Optical Stack</a><a class="va-drawer-link" href="#stage">Link Ledger</a></nav></dialog>\n' +
      '  <dialog id="va-fig-zoom-dialog" closedby="any" aria-label="Expanded Figure"><div class="va-fig-zoom-content"></div></dialog>\n' +
      '</div>\n<script>\nwindow.openShellDrawer=function(){var d=document.getElementById("va-shell-drawer");if(d&&d.showModal)d.showModal();};\nwindow.closeShellDrawer=function(){var d=document.getElementById("va-shell-drawer");if(d&&d.close)d.close();};\n' + (jsEl ? jsEl.textContent : '') + '\n<\/script>\n</body>\n</html>';
  }

  const TIER_SHELL_NAV = {
    'doc-1':    ['fa-book-open', 'DSOC Monograph', ['Abstract', 'Optical Stack', 'Allan Variance', 'Link Ledger']],
    'doc-2':    ['fa-file-signature', 'NASA KDP-C Board', ['BLUF', 'Impact KPIs', 'Risk Matrix', 'Trade Study']],
    'doc-3':    ['fa-microchip', 'CCSDS 133.0-B-2', ['Bitfield Header', 'Normative Clauses', 'FOP-1 FSM', 'Schema Diff']],
    'doc-4b':   ['fa-code', 'DSOC Ground SDK', ['6-Stage Pipeline', 'Decision Router', 'BAR0 MMIO', 'Python API']],
    'doc-4a':   ['fa-clipboard-check', 'SOP-DSOC-704', ['Laser Interlock', 'Pass Lifelines', 'Procedure Steps', 'CLI Console']],
    'bridge-1': ['fa-calculator', 'Link Margin Solver', ['Equations', 'Parametric Solver', 'Mission Ledger', 'Gradients']],
    'deck-1':   ['fa-display', 'FRR Flight Briefing', ['Exec Summary', 'Link Budget', 'SNSPD Array', 'Readiness Poll']],
    'bridge-2': ['fa-satellite-dish', 'DSN 810-005 Matrix', ['Goldstone', 'Madrid', 'Canberra', 'Phase Skew']],
    'app-2':    ['fa-wave-square', 'SNSPD HIL Bench', ['Quad Waveforms', 'Phase Residual', 'BAR0 Registers', 'Cryo Channels']],
    'app-1':    ['fa-triangle-exclamation', 'Psyche Flight Ops', ['Discrepancy Queue', 'Comm / Optical', 'GNC Pointing', 'Incident Audit']],
    'app-4':    ['fa-calendar-day', 'NRHO Ops Planner', ['Orbit Timeline', 'Flight Tasks', 'Focus Block', 'Staging Inbox']],
    'app-3':    ['fa-chart-pie', 'DSN Executive', ['Trajectory Gain', 'Science Volume', 'Complex Share', 'Pass Schedule']],
    'app-5':    ['fa-moon', 'Crew Readiness', ['Circadian Phase', 'Readiness Ring', 'Cabin Biometrics', 'Biomarker Gate']],
    'app-tree': ['fa-folder-tree', 'Packet Explorer', ['Packet Stream', 'Header Spec', 'ER Lineage', 'JSONB Inspector']],
    'hud-1':    ['fa-crosshairs', 'Cupola AR HUD', ['Boresight', 'Attitude LOS', 'Astrometry', 'Link Margin']],
    'ctrl-1':   ['fa-sliders', 'HALO ECLSS Console', ['ECLSS Loop', 'Power Bus', 'Thermal TCS', 'Optical Cryo']]
  };
  const NAV_ITEM_ICONS = ['fa-compass', 'fa-wave-square', 'fa-sliders', 'fa-shield-halved'];

  function syncShellNav(doc, tier) {
    const cfg = TIER_SHELL_NAV[tier] || TIER_SHELL_NAV['doc-1'];
    const brand = doc.querySelector('#va-shell-topbar .va-shell-brand');
    if (brand) brand.innerHTML = '<i class="fa-solid ' + cfg[0] + '" aria-hidden="true"></i> ' + cfg[1];
    const topLinks = doc.querySelector('#va-shell-topbar .va-shell-topbar-links');
    if (topLinks) {
      topLinks.innerHTML = cfg[2].map(function(lbl, i) {
        return '<a class="va-shell-topbar-link' + (i === 0 ? ' is-active' : '') + '" href="#stage">' + lbl + '</a>';
      }).join('');
    }
    const rail = doc.getElementById('va-shell-rail');
    if (rail) {
      rail.innerHTML = '<div class="va-rail-brand"><i class="fa-solid ' + cfg[0] + '" aria-hidden="true"></i> <span>' + cfg[1] + '</span></div>' +
        cfg[2].map(function(lbl, i) {
          return '<a class="va-rail-link' + (i === 0 ? ' is-active' : '') + '" href="#stage"><i class="fa-solid ' + NAV_ITEM_ICONS[i % 4] + '" aria-hidden="true"></i> ' + lbl + '</a>';
        }).join('');
    }
    const dock = doc.getElementById('va-shell-bottomdock');
    if (dock) {
      dock.innerHTML = cfg[2].slice(0, 3).map(function(lbl, i) {
        const shortLbl = lbl.split(' ')[0];
        return '<button type="button"' + (i === 0 ? ' class="is-active"' : '') + '><i class="fa-solid ' + NAV_ITEM_ICONS[i] + '" aria-hidden="true"></i>' + shortLbl + '</button>';
      }).join('') + '<button type="button" onclick="openShellDrawer()"><i class="fa-solid fa-bars" aria-hidden="true"></i>Menu</button>';
    }
    const drawerNav = doc.querySelector('#va-shell-drawer .va-drawer-nav');
    if (drawerNav) {
      drawerNav.innerHTML = cfg[2].map(function(lbl, i) {
        return '<a class="va-drawer-link' + (i === 0 ? ' is-active' : '') + '" href="#stage" onclick="closeShellDrawer()">' + lbl + '</a>';
      }).join('');
    }
  }

  function syncIframeAttributes() {
    const iframe = document.getElementById('va-stage-portal');
    if (!iframe || !iframe.contentDocument || state.view !== 'ui') return;
    const docEl = iframe.contentDocument.documentElement;
    if (!docEl) return;
    const dims = getActiveDimensions();
    const stageW = dims ? dims.width : (iframe.clientWidth || window.innerWidth);
    const meta = getTierMeta(state.tier);
    docEl.dataset.theme = state.theme;
    docEl.dataset.density = state.density;
    docEl.dataset.corners = state.corners;
    docEl.dataset.tier = state.tier;
    docEl.dataset.navShell = state.nav;
    docEl.dataset.effectiveNav = computeEffectiveNav(state.nav, state.tier, stageW);
    docEl.dataset.formFactor = (stageW <= 480) ? 'touch' : 'desktop';
    docEl.dataset.stageLock = (state.tier === 'app-tree' && stageW < 1100) ? 'scroll' : meta.stageLock;
    if (state.scale && state.scale !== '100') docEl.style.fontSize = state.scale + '%';
    else docEl.style.removeProperty('font-size');
  }

  function syncIframeDOM() {
    const iframe = document.getElementById('va-stage-portal');
    if (!iframe || !iframe.contentDocument) return;
    syncIframeAttributes();
    const main = iframe.contentDocument.getElementById('va-stage-main');
    if (main && state.renderedTier !== state.tier) {
      const meta = getTierMeta(state.tier);
      main.innerHTML = meta.tpl ? meta.tpl.innerHTML : '<div style="padding:2rem;">Stage Content Not Found</div>';
      syncShellNav(iframe.contentDocument, state.tier);
      state.renderedTier = state.tier;
    }
    if (window.QuietStudioSheet) window.QuietStudioSheet.bindPortalScrollTuck(iframe);
  }

  function syncCenterSelect() {
    const sel = document.getElementById('va-tier-select');
    if (!sel) return;
    const targetMode = (state.view === 'diagrams') ? 'diagrams' : 'ui';
    if (renderedSelectMode !== targetMode) {
      const list = (targetMode === 'diagrams') ? ATLAS_SECTIONS : uiTierOptions;
      sel.innerHTML = list.map(function(o) { return '<option value="' + o.value + '">' + o.label + '</option>'; }).join('');
      renderedSelectMode = targetMode;
    }
    sel.value = (targetMode === 'diagrams') ? state.atlasSec : state.tier;
    sel.setAttribute('aria-label', targetMode === 'diagrams' ? 'Select Atlas Section' : 'Select Stage Tier');
  }

  function syncBarControls() {
    document.documentElement.dataset.studioView = state.view;
    syncCenterSelect();
    const meta = getTierMeta(state.tier);
    const vpSel = document.getElementById('va-vp-select');
    if (vpSel) vpSel.value = state.vp;
    const navSel = document.getElementById('va-nav-select');
    if (navSel) {
      navSel.value = state.nav;
      Array.from(navSel.options).forEach(function(opt) {
        if (opt.value === 'auto') return;
        const ok = meta.allowed.indexOf(opt.value) !== -1;
        opt.disabled = !ok;
        opt.title = ok ? '' : ('Disabled for ' + state.tier);
      });
    }
    const stageTools = document.getElementById('va-stage-tools');
    if (stageTools) stageTools.hidden = (state.vp === 'fill');
    const zoomBtn = document.getElementById('va-zoom-btn');
    if (zoomBtn) zoomBtn.textContent = state.zoom.toUpperCase();
    [['va-view-ui-btn', 'ui'], ['va-view-diag-btn', 'diagrams']].forEach(function(pair) {
      const btn = document.getElementById(pair[0]);
      if (btn) {
        btn.classList.toggle('is-active', state.view === pair[1]);
        btn.setAttribute('aria-selected', state.view === pair[1] ? 'true' : 'false');
      }
    });
    if (window.QuietStudioSheet) window.QuietStudioSheet.syncSheetControls(state, meta.allowed);
  }

  function postAtlasSync(iframe) {
    if (iframe && iframe.contentWindow) {
      iframe.contentWindow.postMessage({
        type: 'quiet-ui-sync', theme: state.theme, density: state.density,
        corners: state.corners, atlasSection: state.atlasSec
      }, '*');
    }
  }

  function applyState() {
    const iframe = document.getElementById('va-stage-portal');
    if (!iframe) return;
    updatePortalDimensions();
    if (state.view === 'diagrams') {
      const targetSrc = resolveDocsAsset('diagrams.html') + '?embed=1&theme=' + encodeURIComponent(state.theme);
      state.isMounted = false;
      state.renderedTier = '';
      iframe.removeAttribute('srcdoc');
      if (!iframe.getAttribute('src') || iframe.getAttribute('src').indexOf('diagrams.html') === -1) {
        iframe.onload = function() {
          if (window.QuietStudioSheet) window.QuietStudioSheet.bindPortalScrollTuck(iframe);
          postAtlasSync(iframe);
        };
        iframe.src = targetSrc;
      } else {
        postAtlasSync(iframe);
      }
      syncBarControls();
      syncUrlParams();
      return;
    }
    if (!state.isMounted || !iframe.contentDocument || !iframe.contentDocument.getElementById('va-stage-main')) {
      state.renderedTier = '';
      iframe.removeAttribute('src');
      iframe.onload = function() { state.isMounted = true; updatePortalDimensions(); syncIframeDOM(); };
      iframe.srcdoc = buildIframeSrcDoc();
    } else {
      syncIframeDOM();
    }
    syncBarControls();
    syncUrlParams();
  }

  function stepCenterOption(delta) {
    const list = (state.view === 'diagrams') ? ATLAS_SECTIONS : uiTierOptions;
    if (!list.length) return;
    const curVal = (state.view === 'diagrams') ? state.atlasSec : state.tier;
    let idx = list.findIndex(function(o) { return o.value === curVal; });
    idx = (idx + delta + list.length) % list.length;
    if (state.view === 'diagrams') state.atlasSec = list[idx].value;
    else state.tier = list[idx].value;
    if (window.QuietStudioSheet) window.QuietStudioSheet.untuckStudioBar();
    applyState();
  }

  function initControls() {
    const tierSel = document.getElementById('va-tier-select');
    if (tierSel) {
      uiTierOptions = Array.from(tierSel.options).map(function(o) { return { value: o.value, label: o.textContent }; });
      if (uiTierOptions.length && !uiTierOptions.some(function(o) { return o.value === state.tier; })) state.tier = uiTierOptions[0].value;
      tierSel.addEventListener('change', function(e) {
        if (state.view === 'diagrams') state.atlasSec = e.target.value;
        else state.tier = e.target.value;
        if (window.QuietStudioSheet) window.QuietStudioSheet.untuckStudioBar();
        applyState();
      });
    }
    ['vp', 'theme', 'density', 'corners', 'nav'].forEach(function(k) {
      const el = document.getElementById('va-' + k + '-select');
      if (el) el.addEventListener('change', function(e) { state[k] = e.target.value; applyState(); });
    });
    const prevBtn = document.getElementById('va-step-prev');
    const nextBtn = document.getElementById('va-step-next');
    if (prevBtn) prevBtn.addEventListener('click', function() { stepCenterOption(-1); });
    if (nextBtn) nextBtn.addEventListener('click', function() { stepCenterOption(1); });

    const onRotate = function() { const d = getActiveDimensions(); if (d) { state.vp = d.height + 'x' + d.width; applyState(); } };
    const onZoomToggle = function() { state.zoom = (state.zoom === 'fit') ? '1:1' : 'fit'; updatePortalDimensions(); syncBarControls(); syncUrlParams(); };
    const rotBtn = document.getElementById('va-rotate-btn');
    const zoomBtn = document.getElementById('va-zoom-btn');
    if (rotBtn) rotBtn.addEventListener('click', onRotate);
    if (zoomBtn) zoomBtn.addEventListener('click', onZoomToggle);

    [['va-view-ui-btn', 'ui'], ['va-view-diag-btn', 'diagrams']].forEach(function(pair) {
      const btn = document.getElementById(pair[0]);
      if (btn) btn.addEventListener('click', function() {
        state.view = pair[1];
        if (window.QuietStudioSheet) window.QuietStudioSheet.untuckStudioBar();
        applyState();
      });
    });
    const custBtn = document.getElementById('va-customize-btn');
    if (custBtn) custBtn.addEventListener('click', function() {
      const sheet = document.getElementById('va-customize-sheet');
      if (sheet && typeof sheet.showModal === 'function') sheet.showModal();
    });
    if (window.QuietStudioSheet) window.QuietStudioSheet.initSheetEvents(state, applyState, onRotate, onZoomToggle);
    window.addEventListener('resize', function() {
      if (window.innerWidth >= 700 && window.QuietStudioSheet) window.QuietStudioSheet.untuckStudioBar();
      updatePortalDimensions();
      syncIframeAttributes();
    });
    window.QuietPortalResize.initResizeHandles(
      document.getElementById('va-portal-scaler'), document.getElementById('va-stage-portal'), document.getElementById('va-portal-mat'),
      function(w, h) { state.vp = w + 'x' + h; syncIframeAttributes(); syncUrlParams(); syncBarControls(); }
    );
  }

  window.switchTier = function(slug) { state.view = 'ui'; state.tier = slug; applyState(); };
  window.addEventListener('DOMContentLoaded', function() { readUrlParams(); initControls(); applyState(); });
  window.QuietStudioPortal = { state: state, applyState: applyState, syncIframeDOM: syncIframeDOM };
})(typeof window !== 'undefined' ? window : this);

  </script>
</body>
</html>
